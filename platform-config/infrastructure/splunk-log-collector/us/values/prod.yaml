targetNamespace: prod
clusterName: electrahub-k3d
environment: prod

splunk:
  endpoint: https://splunk.prod.svc.cluster.local:8088
  index: main
  sourceType: kubernetes:container
  quotaGate:
    enabled: true
    # Stay below the 500 MB/day Splunk Free ingestion allowance.
    maxDailyBytes: 419430400

elasticsearch:
  enabled: true
  endpoint: http://elasticsearch-logs.prod.svc.cluster.local:9200
  index: electrahub-kubernetes-%Y.%m.%d
