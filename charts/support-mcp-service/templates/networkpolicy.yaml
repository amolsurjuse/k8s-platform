apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: support-mcp-private
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: support-mcp-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: ai-support-service}
      ports: [{protocol: TCP, port: 8095}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: {{ .Values.monitoring.instance }}
      ports: [{protocol: TCP, port: 8097}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: api-gateway}
      ports: [{protocol: TCP, port: 8090}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: {{ .Values.cluster.apiServiceCidr }}}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - ipBlock: {cidr: {{ .Values.cluster.apiEndpointCidr }}}
      ports: [{protocol: TCP, port: {{ .Values.cluster.apiEndpointPort }}}]
