apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-mcp-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: support-mcp-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # One process owns the bounded infrastructure cache on this RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: support-mcp-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-mcp-service
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: support-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}@{{ required "support-mcp image.digest must be set to the published image digest" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: mcp, containerPort: 8095}
            - {name: management, containerPort: 8097}
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx320m -XX:+ExitOnOutOfMemoryError"}
            - {name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/app/config/application-runtime.yaml"}
            - {name: MCP_BIND_ADDRESS, value: "0.0.0.0"}
            - {name: MCP_MANAGEMENT_ADDRESS, value: "0.0.0.0"}
            - {name: SUPPORT_MCP_GATEWAY_URL, value: {{ .Values.gatewayUrl | quote }}}
            - {name: SUPPORT_MCP_MEMORY_DIRECTORY, value: "/app/data"}
            - {name: SUPPORT_MCP_CLUSTER_ENABLED, value: {{ .Values.cluster.enabled | quote }}}
            - {name: SUPPORT_MCP_CLUSTER_NAMESPACES, value: {{ .Release.Namespace | quote }}}
            - {name: SUPPORT_MCP_CLUSTER_ID, value: {{ .Values.cluster.id | quote }}}
            - {name: SUPPORT_MCP_CLUSTER_RECONCILE_MS, value: {{ .Values.cluster.reconcileMs | quote }}}
            - {name: SUPPORT_MCP_CLUSTER_TTL_SECONDS, value: {{ .Values.cluster.ttlSeconds | quote }}}
            - name: APP_INTERNAL_ACCESS_CONTEXT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identitySecret.name }}
                  key: {{ .Values.identitySecret.key }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: memory, mountPath: /app/data}
            - {name: tmp, mountPath: /app/tmp}
            - {name: config, mountPath: /app/config, readOnly: true}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            timeoutSeconds: 2
      volumes:
        - name: memory
          persistentVolumeClaim: {claimName: support-mcp-memory}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: config
          configMap: {name: support-mcp-service-config}
