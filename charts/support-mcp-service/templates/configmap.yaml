apiVersion: v1
kind: ConfigMap
metadata:
  name: support-mcp-service-config
  namespace: {{ .Release.Namespace }}
data:
  application-runtime.yaml: |
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      metrics:
        tags:
          service: support-mcp-service
          env: {{ .Values.monitoring.environment | quote }}
          region: {{ .Values.monitoring.region | quote }}
          version: {{ .Values.image.tag | quote }}
        distribution:
          percentiles-histogram:
            http.server.requests: true
            http.client.requests: true
          slo:
            http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,10s
            http.client.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,10s,20s,30s
