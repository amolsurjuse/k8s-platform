replicaCount: 1

image:
  pullPolicy: Always

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false

config:
  data:
    SUPPORT_EMAIL: "support@electrahub.com"
    AI_PROVIDER: "ollama"
    AI_PROVIDER_CHAIN: "ollama"
    AI_MODEL: "electrahub-sparky:4b"
    OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    AI_LOCAL_WARMUP_ENABLED: "true"
