replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "prod"

extraSecretEnv:
  - name: BOOKSTACK_TOKEN_ID
    secretName: ai-support-bookstack-secret
    secretKey: BOOKSTACK_TOKEN_ID
  - name: BOOKSTACK_TOKEN_SECRET
    secretName: ai-support-bookstack-secret
    secretKey: BOOKSTACK_TOKEN_SECRET

extraSecretEnv:
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"

image:
  pullPolicy: Always

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false

config:
  data:
    SUPPORT_EMAIL: "support@electrahub.com"
    SPRING_DATA_REDIS_HOST: "redis"
    SPRING_DATA_REDIS_PORT: "6379"
    AI_MULTITENANCY_ENABLED: "true"
    AI_TENANT_QUOTA_ENABLED: "true"
    AI_TENANT_QUOTA_FAIL_CLOSED: "true"
    AI_TENANT_DEFAULT_REQUESTS_PER_MINUTE: "60"
    AI_TENANT_DEFAULT_REQUESTS_PER_DAY: "5000"
    AI_TENANT_DEFAULT_TOKENS_PER_DAY: "1000000"
    AI_TENANT_EVALUATION_ENABLED: "true"
    AI_TENANT_EVALUATION_TENANTS: "electrahub"
    AI_TENANT_EVALUATION_INITIAL_DELAY_MS: "30000"
    AI_TENANT_EVALUATION_INTERVAL_MS: "900000"
    AI_STREAM_TOKEN_DELAY_MS: "0"
    AI_PROVIDER: "openai"
    AI_PROVIDER_CHAIN: "openai"
    AI_MODEL: "gpt-5.6-luna"
    AI_VLLM_ENABLED: "false"
    VLLM_BASE_URL: "http://vllm:8000"
    VLLM_MODEL: "sparky-qwen3-8b"
    AI_VLLM_TIMEOUT_MS: "7000"
    AI_OLLAMA_ENABLED: "false"
    OLLAMA_MODEL: "electrahub-sparky:4b"
    AI_OLLAMA_TIMEOUT_MS: "14000"
    AI_OLLAMA_MAX_CONCURRENT_REQUESTS: "1"
    OLLAMA_KEEP_ALIVE: "4h"
    AI_LOCAL_WARMUP_ENABLED: "true"
    AI_LOCAL_WARMUP_TIMEOUT_MS: "30000"
    AI_OVMS_ENABLED: "false"
    OVMS_BASE_URL: "http://host.docker.internal:8000"
    OVMS_MODEL: "OpenVINO/Qwen3-8B-int4-ov"
    AI_OVMS_TIMEOUT_MS: "12000"
    AI_GEMINI_ENABLED: "false"
    AI_HOSTED_FALLBACK_ENABLED: "false"
    GEMINI_BASE_URL: "https://generativelanguage.googleapis.com"
    GEMINI_MODEL: "gemini-2.5-flash-lite"
    AI_GEMINI_TIMEOUT_MS: "7000"
    AI_PROVIDER_FAILURE_COOLDOWN_MS: "30000"
    AI_TEMPERATURE: "0.12"
    AI_MAX_OUTPUT_TOKENS: "180"
    AI_LLM_TIMEOUT_MS: "30000"
    AI_BOOKSTACK_ENABLED: "true"
