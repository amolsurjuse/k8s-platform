fullnameOverride: "ai-support-service"
image:
  repository: amolsurjuse/ai-support-service

service:
  port: 8094
containerPort: 8094

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secrets:
  existingSecretName: ai-support-openai-secret
  optional: true
  env:
    OPENAI_API_KEY: OPENAI_API_KEY
    GEMINI_API_KEY: GEMINI_API_KEY

config:
  data:
    SERVER_PORT: "8094"
    AI_PROVIDER_ENABLED: "true"
    AI_PROVIDER: "openai"
    AI_PROVIDER_CHAIN: "openai"
    OPENAI_BASE_URL: "https://api.openai.com"
    OLLAMA_BASE_URL: "http://ollama:11434"
    AI_MODEL: "gpt-4.1-mini"
    AI_VLLM_ENABLED: "false"
    VLLM_BASE_URL: "http://vllm:8000"
    VLLM_MODEL: "sparky-qwen3-8b"
    AI_VLLM_TIMEOUT_MS: "7000"
    AI_OLLAMA_ENABLED: "true"
    OLLAMA_MODEL: "electrahub-sparky:4b"
    AI_OLLAMA_TIMEOUT_MS: "14000"
    AI_OLLAMA_MAX_CONCURRENT_REQUESTS: "1"
    OLLAMA_KEEP_ALIVE: "4h"
    AI_LOCAL_WARMUP_ENABLED: "true"
    AI_LOCAL_WARMUP_TIMEOUT_MS: "30000"
    AI_OVMS_ENABLED: "false"
    OVMS_BASE_URL: "http://ovms:8000"
    OVMS_MODEL: "OpenVINO/Qwen3-8B-int4-ov"
    AI_OVMS_TIMEOUT_MS: "12000"
    AI_GEMINI_ENABLED: "false"
    AI_HOSTED_FALLBACK_ENABLED: "false"
    GEMINI_BASE_URL: "https://generativelanguage.googleapis.com"
    GEMINI_MODEL: "gemini-2.5-flash-lite"
    AI_GEMINI_TIMEOUT_MS: "7000"
    AI_PROVIDER_FAILURE_COOLDOWN_MS: "30000"
    AI_TEMPERATURE: "0.12"
    AI_MAX_OUTPUT_TOKENS: "180"
    AI_LLM_TIMEOUT_MS: "30000"
    AI_DIAGNOSTICS_TIMEOUT_MS: "1800"
    AI_DIAGNOSTICS_TOTAL_TIMEOUT_MS: "3000"
    AI_THREAD_TTL_MS: "900000"
    SUPPORT_EMAIL: "support@electrahub.com"
    AI_STREAM_TOKEN_DELAY_MS: "18"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
    MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 25
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 60

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
