replicaCount: 2

image:
  pullPolicy: Always

resources:
  requests:
    cpu: "250m"
    memory: "384Mi"
  limits:
    cpu: "1"
    memory: "768Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
