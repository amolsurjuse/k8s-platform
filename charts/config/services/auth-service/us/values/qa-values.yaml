replicaCount: 2
config:
  enabled: true
  data:
    ENV_AUTH_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/user_db"
env:
  SPRING_PROFILES_ACTIVE: "qa"
resources:
  requests:
    cpu: 300m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi
ingress:
  enabled: true
  className: "nginx"
  host: "auth-qa.example.com"
  tls:
    enabled: true
secrets:
  existingSecretName: "auth-service-qa-secrets"
