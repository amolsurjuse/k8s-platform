# Registration, token issuance, and user-service calls must remain available
# during a burst. Four warm replicas keep a 250-user burst below the bounded
# request concurrency of each pod.
replicaCount: 4

config:
  enabled: true
  data:
    ENV_AUTH_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/user_db"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    SERVER_TOMCAT_THREADS_MAX: "96"
    SERVER_TOMCAT_THREADS_MIN_SPARE: "16"
    SERVER_TOMCAT_ACCEPT_COUNT: "250"
    SERVER_TOMCAT_MAX_CONNECTIONS: "600"
    LOGGING_LEVEL_COM_ELECTRAHUB_IDENTITY_OBSERVABILITY: "WARN"
    APP_SECURITY_OAUTH_GOOGLE_ENABLED: "true"
    APP_SECURITY_OAUTH_GOOGLE_AUDIENCES: "980843194952-sk5qap0mioa9qf5pbcv43kuujn7r405j.apps.googleusercontent.com,980843194952-01u6ejpuhqlqh9j7o5bicui674uf6k8h.apps.googleusercontent.com"
    APP_CORS_ALLOWED_ORIGIN_PATTERNS: "https://electrahub.net,https://www.electrahub.net,https://api.electrahub.net,https://admin-portal.electrahub.net,https://driver-portal.electrahub.net,https://ocpp-simulator.electrahub.net"
    APP_DRIVER_RESET_PASSWORD_URL: "https://driver-portal.electrahub.net/reset-password"

secrets:
  existingSecretName: "postgresql-prod-secret"
  env:
    ENV_AUTH_DATASOURCE_USERNAME: "POSTGRES_USER"
    ENV_AUTH_DATASOURCE_PASSWORD: "POSTGRES_PASSWORD"

extraSecretEnv:
  - name: "APP_SECURITY_JWT_SECRET"
    secretName: "auth-jwt-prod-secret"
    secretKey: "APP_SECURITY_JWT_SECRET"

env:
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_LIQUIBASE_ENABLED: "true"
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "https://electrahub.net,https://www.electrahub.net,https://api.electrahub.net,https://admin-portal.electrahub.net,https://driver-portal.electrahub.net,https://ocpp-simulator.electrahub.net"
  APP_DRIVER_RESET_PASSWORD_URL: "https://driver-portal.electrahub.net/reset-password"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "768Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
