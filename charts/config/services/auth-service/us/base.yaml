fullnameOverride: "auth-service"
image:
  repository: amolsurjuse/auth-service
service:
  port: 8080
containerPort: 8080
grpc:
  enabled: true
  port: 9080
  containerPort: 9080
env:
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:4200,http://localhost:4201,http://localhost:4211,http://localhost:8080,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com,https://driver-portal-dev.electrahub.com:8443,https://driver-portal-*.electrahub.com,https://driver-portal-*.electrahub.com:*,https://admin-portal-dev.electrahub.com,https://admin-portal-dev.electrahub.com:8443,https://admin-portal-*.electrahub.com,https://admin-portal-*.electrahub.com:*,https://dev.electrahub.net,https://api-dev.electrahub.net,https://driver-dev.electrahub.net,https://driver-portal-dev.electrahub.net,https://admin-dev.electrahub.net,https://admin-portal-dev.electrahub.net,https://simulator-dev.electrahub.net,https://ocpp-simulator-dev.electrahub.net,https://argocd-dev.electrahub.net"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
secrets:
  env:
    ENV_AUTH_DATASOURCE_USERNAME: "ENV_AUTH_DATASOURCE_USERNAME"
    ENV_AUTH_DATASOURCE_PASSWORD: "ENV_AUTH_DATASOURCE_PASSWORD"

config:
  data:
    LOGGING_LEVEL_ROOT: "INFO"
    LOGGING_LEVEL_COM_ELECTRAHUB_IDENTITY: "INFO"
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "WARN"
    LOGGING_LEVEL_ORG_HIBERNATE: "WARN"
    LOGGING_LEVEL_LIQUIBASE: "INFO"
    SPRING_LIQUIBASE_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_JPA_OPEN_IN_VIEW: "false"
    SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
    SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: "UTC"
    SPRING_DATA_REDIS_HOST: "redis"
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_DATA_REDIS_TIMEOUT: "2s"
    SPRING_DATA_REDIS_LETTUCE_POOL_ENABLED: "true"
    SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "16"
    SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "16"
    SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "2"
    SPRING_DATA_REDIS_LETTUCE_POOL_TIME_BETWEEN_EVICTION_RUNS: "30s"
    SPRING_RABBITMQ_HOST: "rabbitmq"
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_USERNAME: "guest"
    SPRING_RABBITMQ_PASSWORD: "guest"
    APP_NOTIFICATION_EXCHANGE: "notifications.events"
    APP_NOTIFICATION_DOMAIN_ROUTING_KEY: "notifications.domain"
    APP_NOTIFICATION_TENANT_ID: "electrahub"
    APP_DRIVER_RESET_PASSWORD_URL: "https://driver-portal.electrahub.net/reset-password"
    APP_SECURITY_JWT_ISSUER: "auth-service"
    APP_SECURITY_JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_64+_CHAR_SECRET_CHANGE_ME"
    APP_SECURITY_JWT_ACCESS_TOKEN_TTL_MINUTES: "15"
    APP_SECURITY_JWT_ADMIN_ACCESS_TOKEN_TTL_MINUTES: "30"
    APP_SECURITY_JWT_REFRESH_TOKEN_TTL_DAYS: "30"
    APP_SECURITY_OAUTH_GOOGLE_ENABLED: "false"
    APP_SECURITY_OAUTH_GOOGLE_ISSUER: "https://accounts.google.com"
    APP_SECURITY_OAUTH_GOOGLE_JWK_SET_URI: "https://www.googleapis.com/oauth2/v3/certs"
    APP_SECURITY_OAUTH_GOOGLE_AUDIENCES: ""
    APP_SECURITY_OAUTH_GOOGLE_AUTO_PROVISION_USERS: "true"
    APP_SECURITY_OAUTH_FACEBOOK_ENABLED: "false"
    APP_SECURITY_OAUTH_FACEBOOK_GRAPH_BASE_URL: "https://graph.facebook.com"
    APP_SECURITY_OAUTH_FACEBOOK_APP_ID: ""
    APP_SECURITY_OAUTH_FACEBOOK_AUTO_PROVISION_USERS: "true"
    APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:4200,http://localhost:4201,http://localhost:4211,http://localhost:8080,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com,https://driver-portal-dev.electrahub.com:8443,https://driver-portal-*.electrahub.com,https://driver-portal-*.electrahub.com:*,https://admin-portal-dev.electrahub.com,https://admin-portal-dev.electrahub.com:8443,https://admin-portal-*.electrahub.com,https://admin-portal-*.electrahub.com:*,https://dev.electrahub.net,https://api-dev.electrahub.net,https://driver-dev.electrahub.net,https://driver-portal-dev.electrahub.net,https://admin-dev.electrahub.net,https://admin-portal-dev.electrahub.net,https://simulator-dev.electrahub.net,https://ocpp-simulator-dev.electrahub.net,https://argocd-dev.electrahub.net"
    APP_COOKIES_REFRESH_NAME: "__Host-rt"
    APP_COOKIES_DEVICE_NAME: "did"
    APP_COOKIES_SAME_SITE: "Strict"
    APP_CACHE_USER_DETAILS_TTL_SECONDS: "300"
    APP_REDIS_REFRESH_PREFIX: "rt:"
    APP_REDIS_REFRESH_USER_PREFIX: "rtu:"
    APP_REDIS_REFRESH_DEVICE_PREFIX: "rtd:"
    APP_REDIS_DENYLIST_PREFIX: "deny:jwt:"
    APP_REDIS_TOKEN_VERSION_PREFIX: "tv:"
    OPENAPI_ENABLED: "true"
    SPRINGDOC_API_DOCS_PATH: "/v3/api-docs"
    SPRINGDOC_SWAGGER_UI_PATH: "/swagger-ui.html"
    SPRINGDOC_SWAGGER_UI_DISABLE_DEFAULT_URL: "false"
    APP_USER_SERVICE_BASE_URL: "http://user-service:8082"
