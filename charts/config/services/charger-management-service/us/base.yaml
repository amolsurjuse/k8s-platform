fullnameOverride: "charger-management-service"
image:
  repository: amolsurjuse/charger-management-service
  pullPolicy: Always

service:
  port: 8086
containerPort: 8086
grpc:
  enabled: true
  port: 9086
  containerPort: 9086

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secrets:
  env:
    SPRING_LIQUIBASE_USER: "POSTGRES_USER"
    SPRING_LIQUIBASE_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8086"
    ENV_CHARGER_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/charger_management_db"
    SPRING_LIQUIBASE_ENABLED: "true"
    SPRING_LIQUIBASE_DEFAULT_SCHEMA: "public"
    SPRING_LIQUIBASE_LIQUIBASE_SCHEMA: "public"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    CHARGER_ELASTICSEARCH_ENABLED: "true"
    SPRING_DATA_ELASTICSEARCH_REPOSITORIES_ENABLED: "false"
    ELASTICSEARCH_URIS: "http://elasticsearch:9200"
    SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
    ELASTIC_CLIENT_APIVERSIONING: "false"
    BILLING_SERVICE_ENABLED: "true"
    BILLING_SERVICE_URL: "http://billing-service:8085"
    OCPP_SERVICE_ENABLED: "true"
    OCPP_SERVICE_URL: "http://ocpp-service:8082"
    OCPP_HEARTBEAT_FRESHNESS_SECONDS: "180"
    # Gate 7C2 is shipped inert. Enabling automation still requires actuation,
    # an exact tenant/location allowlist entry, and an ENFORCE policy.
    SMART_CHARGING_ACTUATION_ENABLED: "false"
    SMART_CHARGING_ENFORCEMENT_ALLOWLIST: ""
    SMART_CHARGING_AUTOMATION_ENABLED: "false"
    SMART_CHARGING_AUTOMATION_POLL_INTERVAL_MS: "5000"
    SMART_CHARGING_AUTOMATION_BATCH_SIZE: "25"
    SMART_CHARGING_AUTOMATION_TICK_DEADLINE_SECONDS: "20"
    SMART_CHARGING_ATTEMPT_TIMEOUT_SECONDS: "20"
    SMART_CHARGING_MAX_RETRIES: "3"
    SMART_CHARGING_RETRY_BASE_SECONDS: "5"
    SMART_CHARGING_RETRY_MAX_SECONDS: "30"
    SMART_CHARGING_RETRY_JITTER_SECONDS: "3"
    # Gate 7C3-B is shipped inert. The lifecycle consumer is activated only
    # after the fallback and safety controls in Gates 7C3-C/D are validated.
    SMART_CHARGING_EVENTS_ENABLED: "false"
    SMART_CHARGING_LIFECYCLE_TOPIC: "session.lifecycle.v2"
    SMART_CHARGING_EVENT_CONSUMER_GROUP: "charger-smart-charging-v1"
    SMART_CHARGING_EVENT_MAXIMUM_AGE_HOURS: "168"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    APP_CORS_ALLOWED_ORIGIN_1: "http://localhost:4200"
    APP_CORS_ALLOWED_ORIGIN_2: "http://localhost:8080"
    APP_CORS_ALLOWED_ORIGIN_3: "https://dev.electrahub.com"
    APP_CORS_ALLOWED_ORIGIN_4: "https://dev.electrahub.com:8443"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
