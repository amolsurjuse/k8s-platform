secrets:
  existingSecretName: "postgresql-dev-secret"

extraSecretEnv:
  - name: "ENV_CHARGER_DATASOURCE_USERNAME"
    secretName: "charger-runtime-db-secret"
    secretKey: "username"
  - name: "ENV_CHARGER_DATASOURCE_PASSWORD"
    secretName: "charger-runtime-db-secret"
    secretKey: "password"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-dev-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

replicaCount: 1

# Gate 7C3-E step 5: development-only fallback activation for two synthetic
# sites. Events, automation, safety, and production remain disabled.
config:
  data:
    SMART_CHARGING_ACTUATION_ENABLED: "true"
    SMART_CHARGING_ENFORCEMENT_ALLOWLIST: "smart-charge-canary/SC-CANARY-16,smart-charge-canary/SC-CANARY-201"
    SMART_CHARGING_FALLBACK_ENABLED: "true"

podAnnotations:
  electrahub.net/config-revision: "gate7c3e-fallback-canary-v1"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
