secrets:
  existingSecretName: "postgresql-dev-secret"

extraSecretEnv:
  - name: "ENV_CHARGER_DATASOURCE_USERNAME"
    secretName: "charger-runtime-db-secret"
    secretKey: "username"
  - name: "ENV_CHARGER_DATASOURCE_PASSWORD"
    secretName: "charger-runtime-db-secret"
    secretKey: "password"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-dev-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

replicaCount: 1

# Gate 7C3-E step 7A: development-only OBSERVE lifecycle transport probe for
# two synthetic sites. Policies remain OBSERVE, so events are persisted as
# IGNORED and automation has no eligible site. Production remains disabled.
config:
  data:
    SMART_CHARGING_ACTUATION_ENABLED: "true"
    SMART_CHARGING_ENFORCEMENT_ALLOWLIST: "smart-charge-canary/SC-CANARY-16,smart-charge-canary/SC-CANARY-201"
    SMART_CHARGING_FALLBACK_ENABLED: "true"
    SMART_CHARGING_SAFETY_ENABLED: "true"
    SMART_CHARGING_EVENTS_ENABLED: "true"
    SMART_CHARGING_AUTOMATION_ENABLED: "true"
    SMART_CHARGING_AUTHORITATIVE_METER_SOURCES: "smart-charge-canary/SC-CANARY-16/SIM-SITE-METER-16,smart-charge-canary/SC-CANARY-201/SIM-SITE-METER-201"

podAnnotations:
  electrahub.net/config-revision: "gate7c3e-observe-events-v1"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
