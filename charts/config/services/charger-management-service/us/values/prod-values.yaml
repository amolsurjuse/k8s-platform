secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"

env:
  SPRING_PROFILES_ACTIVE: "prod"

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
