secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "ENV_CHARGER_DATASOURCE_USERNAME"
    secretName: "charger-runtime-db-secret"
    secretKey: "username"
  - name: "ENV_CHARGER_DATASOURCE_PASSWORD"
    secretName: "charger-runtime-db-secret"
    secretKey: "password"
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

env:
  SPRING_PROFILES_ACTIVE: "prod"

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
