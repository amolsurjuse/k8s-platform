secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_LIQUIBASE_ENABLED: "false"

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 120

readinessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

livenessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
