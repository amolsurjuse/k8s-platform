secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "APP_SECURITY_ID_TAG_FINGERPRINT_KEY"
    secretName: "ocpp-command-fingerprint-secret"
    secretKey: "APP_SECURITY_ID_TAG_FINGERPRINT_KEY"
  - name: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"

replicaCount: 2

podAnnotations:
  electrahub.io/config-revision: "stage2-ha-routing-v1"

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-Xms1024m -Xmx2048m"
  SERVER_TOMCAT_THREADS_MAX: "500"
  SERVER_TOMCAT_THREADS_MIN_SPARE: "50"
  SERVER_TOMCAT_ACCEPT_COUNT: "1000"
  # Keep charger callbacks off WebSocket I/O threads. The executor is bounded
  # and preserves callback order per charge point.
  OCPP_INBOUND_CALL_EXECUTOR_CORE_POOL_SIZE: "64"
  OCPP_INBOUND_CALL_EXECUTOR_MAX_POOL_SIZE: "64"
  OCPP_INBOUND_CALL_EXECUTOR_QUEUE_CAPACITY: "2000"
  # Lifecycle callbacks are ordered per connector; meter and status updates
  # remain coalesced behind them. Keep enough workers for a burst without
  # allowing individual connector streams to reorder.
  OCPP_TELEMETRY_EXECUTOR_CORE_POOL_SIZE: "32"
  OCPP_TELEMETRY_EXECUTOR_MAX_POOL_SIZE: "32"
  OCPP_TELEMETRY_EXECUTOR_QUEUE_CAPACITY: "1000"
  OCPP_SESSION_CALLBACK_MAX_LIFECYCLE_EVENTS_PER_CONNECTOR: "32"
  OCPP_SESSION_CALLBACK_RETRY_MAX_ATTEMPTS: "8"
  OCPP_SESSION_CALLBACK_RETRY_INITIAL_BACKOFF_MS: "250"
  OCPP_SESSION_CALLBACK_RETRY_MAX_BACKOFF_MS: "5000"

config:
  data:
    # Liquibase owns schema changes. Hibernate validates the result and cannot
    # mutate production implicitly during application startup.
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_JPA_OPEN_IN_VIEW: "false"
    SPRING_LIQUIBASE_ENABLED: "true"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    OCPP_EVENT_KAFKA_ENABLED: "true"
    OCPP_LEGACY_SESSION_CALLBACKS_ENABLED: "false"
    OCPP_DEVICE_EVENT_TOPIC: "ocpp.device-events.v2"
    OCPP_EVENT_TENANT_ID: "electrahub"
    OCPP_EVENT_PUBLISH_TIMEOUT: "3s"
    OCPP_CLUSTER_ROUTING_ENABLED: "true"
    OCPP_CONNECTION_MARKER_TTL_SECONDS: "120"
    # Every active production charger has a distinct credential. Transport
    # enforcement remains a separate WSS ingress gate below this phase.
    OCPP_HANDSHAKE_SECURITY_MODE: "ENFORCE"
    OCPP_HANDSHAKE_REQUIRE_SECURE_TRANSPORT: "true"

terminationGracePeriodSeconds: 60

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - >-
          wget -qO- --post-data='' --header="X-ElectraHub-Internal-Token: ${APP_SECURITY_INTERNAL_TOKEN}"
          http://127.0.0.1:8082/api/v1/ocpp/internal/drain || true;
          sleep 20

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 120

readinessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 1

livenessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "api.electrahub.net"
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  path: /ws/ocpp
  pathType: Prefix
  tls:
    enabled: true
    secretName: "electrahub-prod-tls"

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

# OCPP WebSockets are stateful. Never co-locate production replicas on one node;
# a node loss must leave one CSMS endpoint available for fleet reconnects.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: ocpp-service

# Keep skew explicit for observability and future clusters with more nodes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: ocpp-service
        app.kubernetes.io/name: common

