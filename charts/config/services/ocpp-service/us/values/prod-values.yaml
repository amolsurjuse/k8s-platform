secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

replicaCount: 1

# OCPP sessions are socket-local today. Recreate prevents a rollout from
# briefly accepting two live WebSocket sessions for one charge point.
deploymentStrategy:
  type: Recreate

env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m"
  SERVER_TOMCAT_THREADS_MAX: "500"
  SERVER_TOMCAT_THREADS_MIN_SPARE: "50"
  SERVER_TOMCAT_ACCEPT_COUNT: "1000"

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_LIQUIBASE_ENABLED: "false"

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 120

readinessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

livenessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
