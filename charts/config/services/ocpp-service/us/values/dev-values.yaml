secrets:
  existingSecretName: "postgresql-dev-secret"

replicaCount: 1

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_LIQUIBASE_ENABLED: "false"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
