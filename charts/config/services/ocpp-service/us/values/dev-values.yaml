secrets:
  existingSecretName: "postgresql-dev-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-dev-secret"
    secretKey: "redis-password"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "APP_SECURITY_ID_TAG_FINGERPRINT_KEY"
    secretName: "ocpp-command-fingerprint-secret"
    secretKey: "APP_SECURITY_ID_TAG_FINGERPRINT_KEY"
  - name: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"

replicaCount: 2

podAnnotations:
  electrahub.io/config-revision: "ocpp-kafka-producer-v1"

env:
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_LIQUIBASE_ENABLED: "false"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    OCPP_EVENT_KAFKA_ENABLED: "true"
    OCPP_LEGACY_SESSION_CALLBACKS_ENABLED: "false"
    OCPP_DEVICE_EVENT_TOPIC: "ocpp.device-events.v2"
    OCPP_EVENT_TENANT_ID: "electrahub"
    OCPP_EVENT_PUBLISH_TIMEOUT: "3s"
    OCPP_CLUSTER_ROUTING_ENABLED: "true"
    OCPP_CONNECTION_MARKER_TTL_SECONDS: "120"
    # Observe legacy clients before enforcing protocol and credential checks.
    OCPP_HANDSHAKE_SECURITY_MODE: "AUDIT"

terminationGracePeriodSeconds: 60

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - >-
          wget -qO- --post-data='' --header="X-ElectraHub-Internal-Token: ${APP_SECURITY_INTERNAL_TOKEN}"
          http://127.0.0.1:8082/api/v1/ocpp/internal/drain || true;
          sleep 20

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 120

readinessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 1

livenessProbe:
  enabled: true
  timeoutSeconds: 5
  failureThreshold: 12

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

metrics:
  servicemonitor:
    enabled: true
