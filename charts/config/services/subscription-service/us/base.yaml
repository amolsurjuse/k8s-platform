fullnameOverride: "subscription-service"
image:
  repository: amolsurjuse/subscription-service

service:
  port: 8086
containerPort: 8086
grpc:
  enabled: true
  port: 9086
  containerPort: 9086

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
  ENV_REDIS_HOST: "redis"
  ENV_REDIS_PORT: "6379"
  ENV_REDIS_TIMEOUT: "2s"
  SUBSCRIPTION_ELIGIBILITY_CACHE_TTL: "30s"
  SUBSCRIPTION_ELIGIBILITY_CACHE_JITTER: "3s"
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:4200,http://localhost:4201,http://localhost:4211,http://localhost:8080,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com,https://driver-portal-dev.electrahub.com:8443,https://driver-portal-*.electrahub.com,https://driver-portal-*.electrahub.com:*,https://admin-portal-dev.electrahub.com,https://admin-portal-dev.electrahub.com:8443,https://admin-portal-*.electrahub.com,https://admin-portal-*.electrahub.com:*"

secrets:
  env:
    ENV_SUBSCRIPTION_DATASOURCE_USERNAME: "POSTGRES_USER"
    ENV_SUBSCRIPTION_DATASOURCE_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8086"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    ENV_SUBSCRIPTION_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/subscription_db"
    SPRING_LIQUIBASE_ENABLED: "true"
    SPRING_LIQUIBASE_DEFAULT_SCHEMA: "subscription_mgmt"
    SPRING_LIQUIBASE_LIQUIBASE_SCHEMA: "public"
    SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: "subscription_mgmt"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
