secrets:
  existingSecretName: "postgresql-prod-secret"

# Temporarily quarantined: current image tag is arm64-only and cannot run on
# the amd64 k3d prod cluster. Restore to 1 after publishing an amd64/multiarch
# notification-service image.
replicaCount: 0

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
