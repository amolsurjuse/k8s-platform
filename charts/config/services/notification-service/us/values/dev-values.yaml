secrets:
  existingSecretName: "postgresql-dev-secret"

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false

config:
  data:
    NOTIFICATION_CHANNEL_EMAIL_DAILY_LIMIT: "59"
