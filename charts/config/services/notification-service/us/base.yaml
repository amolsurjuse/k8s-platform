fullnameOverride: "notification-service"
image:
  repository: amolsurjuse/notification-service

service:
  port: 8085
containerPort: 8085

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secrets:
  env:
    SPRING_DATASOURCE_USERNAME: "POSTGRES_USER"
    SPRING_DATASOURCE_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8085"
    SERVER_SERVLET_CONTEXT_PATH: "/notifications"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/appdb"
    SPRING_LIQUIBASE_ENABLED: "true"
    SPRING_LIQUIBASE_DEFAULT_SCHEMA: "public"
    SPRING_LIQUIBASE_SCHEMA: "public"
    SPRING_RABBITMQ_HOST: "rabbitmq"
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_USERNAME: "guest"
    SPRING_RABBITMQ_PASSWORD: "guest"
    NOTIFICATION_BROKER_DISPATCH_DLQ_EXCHANGE: "notifications.dead-letter"
    NOTIFICATION_BROKER_DISPATCH_DLQ: "notifications.dispatch.dlq"
    NOTIFICATION_BROKER_DISPATCH_DLQ_ROUTING_KEY: "notifications.dispatch.dead-letter"
    NOTIFICATION_BROKER_DISPATCH_RETRY_MAX_ATTEMPTS: "4"
    NOTIFICATION_BROKER_DISPATCH_RETRY_INITIAL_INTERVAL_MS: "1000"
    NOTIFICATION_BROKER_DISPATCH_RETRY_MULTIPLIER: "2.0"
    NOTIFICATION_BROKER_DISPATCH_RETRY_MAX_INTERVAL_MS: "10000"
    SPRING_CLOUD_STREAM_DEFAULT_BINDER: "rabbit"
    SPRING_DATA_REDIS_HOST: "redis"
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_DATA_REDIS_TIMEOUT: "2s"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
    MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
    NOTIFICATION_CHANNEL_EMAIL_REAL_SEND_ENABLED: "false"
    NOTIFICATION_CHANNEL_EMAIL_RATE_PER_SECOND: "1"
    NOTIFICATION_CHANNEL_EMAIL_RETRY_ENABLED: "false"
    NOTIFICATION_CHANNEL_EMAIL_PROVIDER: "smtp-email"
    NOTIFICATION_EMAIL_SMTP_HOST: ""
    NOTIFICATION_EMAIL_SMTP_PORT: "587"
    NOTIFICATION_EMAIL_SMTP_USERNAME: ""
    NOTIFICATION_EMAIL_SMTP_PASSWORD: ""
    NOTIFICATION_EMAIL_SMTP_FROM_EMAIL: "no-reply@electrahub.net"
    NOTIFICATION_EMAIL_SMTP_FROM_NAME: "ElectraHub"
    NOTIFICATION_EMAIL_SMTP_STARTTLS_ENABLED: "true"
    NOTIFICATION_EMAIL_SMTP_AUTH_ENABLED: "true"
    NOTIFICATION_EMAIL_SMTP_CONNECTION_TIMEOUT_MS: "10000"
    NOTIFICATION_EMAIL_SMTP_TIMEOUT_MS: "10000"
    NOTIFICATION_EMAIL_SMTP_WRITE_TIMEOUT_MS: "10000"
    NOTIFICATION_CHANNEL_SMS_REAL_SEND_ENABLED: "false"
    NOTIFICATION_CHANNEL_PUSH_REAL_SEND_ENABLED: "false"
    NOTIFICATION_CHANNEL_PUSH_RATE_PER_SECOND: "5"
    NOTIFICATION_CHANNEL_INAPP_ENABLED: "true"
    NOTIFICATION_DRIVER_RESET_PASSWORD_URL: "https://driver-portal.electrahub.net/reset-password"
    FIREBASE_PROJECT_ID: "electrahub-87dec"
    FIREBASE_SERVICE_ACCOUNT_PATH: ""
    FIREBASE_SERVICE_ACCOUNT_JSON: ""
    FIREBASE_SERVICE_ACCOUNT_BASE64: ""
    NOTIFICATION_SES_REGION: "us-east-1"
    NOTIFICATION_APNS_ENVIRONMENT: "sandbox"
    NOTIFICATION_CONTACT_RECIPIENTS: "support@electrahub.net"
    NOTIFICATION_CONTACT_RATE_LIMIT_PER_SECOND: "1"
    NOTIFICATION_CONTACT_DUPLICATE_WINDOW_MINUTES: "15"
    NOTIFICATION_CONTACT_IP_HASH_SALT: "electrahub-contact-form-dev-salt"

readinessProbe:
  enabled: true
  path: /notifications/actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /notifications/actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /notifications/actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
