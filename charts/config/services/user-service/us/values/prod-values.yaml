secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "APP_SECURITY_JWT_SECRET"
    secretName: "auth-jwt-prod-secret"
    secretKey: "APP_SECURITY_JWT_SECRET"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"

env:
  SPRING_PROFILES_ACTIVE: "prod"

# Account registration and credential verification perform BCrypt work. Keep
# several pods warm so a burst of new drivers cannot queue behind one CPU cap.
replicaCount: 3

config:
  enabled: true
  data:
    APP_CORS_ALLOWED_ORIGIN_PATTERNS: "https://electrahub.net,https://www.electrahub.net,https://api.electrahub.net,https://admin-portal.electrahub.net,https://driver-portal.electrahub.net,https://ocpp-simulator.electrahub.net"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
