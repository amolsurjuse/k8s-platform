fullnameOverride: "payment-service"
image:
  repository: amolsurjuse/payment-service

service:
  port: 8083
containerPort: 8083
grpc:
  enabled: true
  port: 9083
  containerPort: 9083

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secrets:
  env:
    ENV_PAYMENT_DATASOURCE_USERNAME: "POSTGRES_USER"
    ENV_PAYMENT_DATASOURCE_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8083"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    ENV_PAYMENT_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/appdb"
    SPRING_LIQUIBASE_ENABLED: "true"
    SPRING_LIQUIBASE_DEFAULT_SCHEMA: "public"
    SPRING_LIQUIBASE_LIQUIBASE_SCHEMA: "public"
    SPRING_RABBITMQ_HOST: "rabbitmq"
    APP_NOTIFICATION_EXCHANGE: "notifications.events"
    APP_NOTIFICATION_DOMAIN_ROUTING_KEY: "notifications.domain"
    APP_NOTIFICATION_TENANT_ID: "electrahub"
    APP_SECURITY_JWT_ISSUER: "auth-service"
    APP_REFUNDS_ENABLED: "false"
    PAYMENT_GATEWAY_SERVICE_URL: "http://payment-gateway-service:8098"
    PAYMENT_GATEWAY_ROUTING_ENABLED: "false"
    PAYMENT_GATEWAY_ROUTING_ENFORCEMENT_ENABLED: "false"
    PAYMENT_GATEWAY_EXECUTION_ENABLED: "true"
    PAYMENT_GATEWAY_EXECUTION_PILOT_NETWORK_IDS: "NW-US-EAST-01"
    PAYMENT_WALLET_EXTERNAL_TOP_UP_ENABLED: "true"
    APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com:8443"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
