replicaCount: 2

resources:
  requests:
    cpu: "150m"
    memory: "256Mi"
  limits:
    cpu: "750m"
    memory: "768Mi"

ingress:
  enabled: true
  className: "nginx"
  host: "payment-service-int.electrahub.com"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  path: /
  pathType: Prefix
  tls:
    enabled: true

hpa:
  enabled: false

pdb:
  enabled: false
