image:
  pullPolicy: Always

secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "PAYMENT_GATEWAY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "APP_SECURITY_JWT_SECRET"
    secretName: "auth-jwt-prod-secret"
    secretKey: "APP_SECURITY_JWT_SECRET"

env:
  SPRING_PROFILES_ACTIVE: "prod"

config:
  data:
    APP_REFUNDS_ENABLED: "true"
    PAYMENT_GATEWAY_INCREMENTAL_AUTHORIZATION_ENABLED: "false"
    PAYMENT_GATEWAY_ROUTING_ENABLED: "true"
    PAYMENT_GATEWAY_ROUTING_ENFORCEMENT_ENABLED: "false"
    PAYMENT_GATEWAY_PILOT_NETWORK_IDS: "NW-US-*,NW-EH-USA-*,NW-EH-IND-DEMO"
    SPRINGDOC_API_DOCS_ENABLED: "false"
    SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    PAYMENT_GATEWAY_CARD_ENROLLMENT_ENABLED: "true"
    PAYMENT_GATEWAY_EXECUTION_PILOT_NETWORK_IDS: "NW-US-*,NW-EH-USA-*,NW-EH-IND-DEMO"
    PAYMENT_GATEWAY_HOSTED_CHECKOUT_PAYER_SCOPES: "IN|ENT-IN-DEMO|NW-EH-IND-DEMO"
    PAYMENT_GATEWAY_CARD_ENROLLMENT_PILOT_NETWORK_IDS: "NW-US-EAST-01"
    PAYMENT_GATEWAY_CARD_ENROLLMENT_PILOT_SCOPES: "ENT-US-DEV|NW-US-EAST-01|US|USD"
    PAYMENT_GATEWAY_TOPUP_HOSTED_CHECKOUT_SCOPES: "IN|INR|ENT-IN-DEMO|NW-EH-IND-DEMO"

podAnnotations:
  electrahub.net/payment-config-revision: "us-regional-adyen-hosted-v2"

replicaCount: 2

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

metrics:
  servicemonitor:
    enabled: false
