image:
  pullPolicy: Always

secrets:
  existingSecretName: "postgresql-dev-secret"

extraSecretEnv:
  - name: "PAYMENT_GATEWAY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

config:
  data:
    APP_REFUNDS_ENABLED: "true"
    # Dev auth-service currently uses this configured HS256 key. Production
    # injects its independent key from a Kubernetes Secret below.
    APP_SECURITY_JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_64+_CHAR_SECRET_CHANGE_ME"
    PAYMENT_GATEWAY_CARD_ENROLLMENT_ENABLED: "true"
    PAYMENT_GATEWAY_EXECUTION_PILOT_NETWORK_IDS: "NW-EH-IND-DEMO"
    PAYMENT_GATEWAY_HOSTED_CHECKOUT_PAYER_SCOPES: "IN|ENT-IN-DEMO|NW-EH-IND-DEMO"
    # Razorpay uses hosted checkout and must not be advertised as reusable
    # saved-card enrollment. Stripe-only scopes belong in these two values.
    PAYMENT_GATEWAY_CARD_ENROLLMENT_PILOT_NETWORK_IDS: ""
    PAYMENT_GATEWAY_CARD_ENROLLMENT_PILOT_SCOPES: ""
    PAYMENT_GATEWAY_TOPUP_HOSTED_CHECKOUT_SCOPES: "IN|INR|ENT-IN-DEMO|NW-EH-IND-DEMO"

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
