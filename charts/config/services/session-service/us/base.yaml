fullnameOverride: "session-service"
image:
  repository: amolsurjuse/session-service

service:
  port: 8083
containerPort: 8083

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secrets:
  env:
    SPRING_DATASOURCE_USERNAME: "POSTGRES_USER"
    SPRING_DATASOURCE_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8083"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/session_db"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    STATION_SERVICE_URL: "http://station-management-service:8081"
    PAYMENT_SERVICE_URL: "http://payment-service:8083"
    PRICING_SERVICE_URL: "http://pricing-service:8092"
    OCPP_SERVICE_URL: "http://ocpp-service:8082"
    ELASTICSEARCH_URIS: "http://elasticsearch:9200"
    SESSION_ELASTICSEARCH_ENABLED: "true"
    AUTH_CACHE_TTL: "3600"
    AUTH_OFFLINE_POLICY: "REJECT"
    SPRING_RABBITMQ_HOST: "rabbitmq"
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_USERNAME: "guest"
    SPRING_RABBITMQ_PASSWORD: "guest"
    APP_NOTIFICATION_EXCHANGE: "notifications.events"
    APP_NOTIFICATION_DOMAIN_ROUTING_KEY: "notifications.domain"
    APP_NOTIFICATION_TENANT_ID: "electrahub"
    SPRING_LIQUIBASE_ENABLED: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
    MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
    SERVER_TOMCAT_THREADS_MAX: "64"
    SERVER_TOMCAT_THREADS_MIN_SPARE: "8"
    SERVER_TOMCAT_ACCEPT_COUNT: "50"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
