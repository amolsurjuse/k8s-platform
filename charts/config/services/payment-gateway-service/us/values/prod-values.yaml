secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "APP_GATEWAY_STRIPE_CREDENTIAL"
    secretName: "payment-gateway-provider-prod"
    secretKey: "APP_GATEWAY_STRIPE_CREDENTIAL"
  - name: "APP_GATEWAY_STRIPE_PUBLISHABLE_KEY"
    secretName: "payment-gateway-provider-prod"
    secretKey: "APP_GATEWAY_STRIPE_PUBLISHABLE_KEY"
  - name: "APP_GATEWAY_STRIPE_WEBHOOK_SECRET"
    secretName: "payment-gateway-provider-prod"
    secretKey: "APP_GATEWAY_STRIPE_WEBHOOK_SECRET"
  - name: "APP_GATEWAY_MOLLIE_CREDENTIAL"
    secretName: "payment-gateway-provider-prod"
    secretKey: "APP_GATEWAY_MOLLIE_CREDENTIAL"
    optional: true
  - name: "APP_GATEWAY_TOKEN_ENCRYPTION_KEY"
    secretName: "payment-gateway-provider-prod"
    secretKey: "APP_GATEWAY_TOKEN_ENCRYPTION_KEY"

env:
  SPRING_PROFILES_ACTIVE: "prod"

image:
  pullPolicy: Always

config:
  data:
    APP_GATEWAY_MOCK_PROVIDER_ENABLED: "false"
    APP_GATEWAY_PRODUCTION_ENABLED: "true"
    APP_GATEWAY_2C2P_WEBHOOK_BASE_URL: "https://api.electrahub.net/payment-gateway/api/v1/gateway/webhooks"
    APP_GATEWAY_MOLLIE_WEBHOOK_BASE_URL: "https://api.electrahub.net/payment-gateway/api/v1/gateway/webhooks"
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

replicaCount: 2

resources:
  requests:
    cpu: "150m"
    memory: "384Mi"
  limits:
    cpu: "750m"
    memory: "768Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
