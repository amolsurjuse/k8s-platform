replicaCount: 4

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "ocpp-simulator.example.com"
  tls:
    enabled: true

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2

metrics:
  servicemonitor:
    enabled: false
