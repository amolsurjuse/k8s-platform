replicaCount: 4

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "ocpp-simulator.electrahub.com"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$3"
  path: /ocpp-simulator(-ui)?(/|$)(.*)
  pathType: ImplementationSpecific
  tls:
    enabled: true

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2

metrics:
  servicemonitor:
    enabled: false
