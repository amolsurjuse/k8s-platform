replicaCount: 2

# Begin with one elected fleet owner. A standby replica is enabled only after
# the owner lease and proxy behavior have been verified in production.
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

extraSecretEnv:
  - name: "ENVIRONMENT_SYNC_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"

extraFieldRefEnv:
  - name: "POD_IP"
    fieldPath: "status.podIP"

config:
  data:
    SIMULATOR_CLUSTER_MODE: "leader"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: true
  className: "nginx"
  host: "ocpp-simulator.electrahub.net"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: "electrahub-prod-tls"

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

metrics:
  servicemonitor:
    enabled: false

extraIngresses:
  - name: api
    fullname: ocpp-simulator-api
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$1"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    rules:
      - host: "ocpp-simulator.electrahub.net"
        paths:
          - path: /(api(?:/.*)?|ocpp(?:/.*)?|ws(?:/.*)?|healthz|readyz)
            pathType: ImplementationSpecific
            serviceName: ocpp-simulator
            servicePort: 8081
    tls:
      - hosts:
          - "ocpp-simulator.electrahub.net"
        secretName: "electrahub-prod-tls"
