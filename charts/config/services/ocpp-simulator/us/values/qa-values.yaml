replicaCount: 2

resources:
  requests:
    cpu: "300m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "ocpp-simulator-qa.example.com"
  tls:
    enabled: true

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

metrics:
  servicemonitor:
    enabled: false
