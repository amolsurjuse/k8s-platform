replicaCount: 2

resources:
  requests:
    cpu: "300m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "ocpp-simulator-qa.electrahub.com"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$3"
  path: /ocpp-simulator(-ui)?(/|$)(.*)
  pathType: ImplementationSpecific
  tls:
    enabled: true

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

metrics:
  servicemonitor:
    enabled: false
