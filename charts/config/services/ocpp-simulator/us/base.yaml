fullnameOverride: "ocpp-simulator"
image:
  repository: amolsurjuse/ocpi-simulator
  tag: "19"

service:
  port: 8081
containerPort: 8081

config:
  data:
    PORT: "8081"
    BASE_URL: "http://ocpp-simulator:8081"
    WS_CONNECTOR_BASE_URL: "http://web-socket-connector:8091"
    DEFAULT_CSMS_URL: "ws://ocpp-service:8082/ws/ocpp"
    PAYMENT_SERVICE_URL: "http://payment-service:8083"
    SESSION_SERVICE_URL: "http://session-service:8083/api/v1"
    AUTO_SEED_CHARGERS: "true"
    AUTO_SYNC_ENVIRONMENT_CHARGERS: "true"
    ENVIRONMENT_SYNC_URL: "http://charger-management-service:8086"
    ENVIRONMENT_SYNC_CHARGERS_PATH: "/api/v1/admin/chargers/connectors?search=EH-US"
    ENVIRONMENT_SYNC_SESSIONS_PATH: "http://session-service:8083/api/v1/sessions/internal/active-by-chargers"
    ENVIRONMENT_SYNC_INTERVAL: "60s"
    ENVIRONMENT_SYNC_SKIP_TLS_VERIFY: "false"
    AUTO_CONNECT_CHARGERS: "true"
    AUTO_CONNECT_INTERVAL: "15s"
    AUTO_CONNECT_MAX_ATTEMPTS_PER_RUN: "1000"
    AUTO_CONNECT_FLEET_LIMIT: "1000"
    ENVIRONMENT_SYNC_FLEET_LIMIT: "1000"
    AUTO_CHARGER_IDS: "EH-BOS-CHG-001,EH-SFO-CHG-001,EH-US-CHG-0001,EH-US-CHG-0002,EH-US-CHG-0003,EH-US-CHG-0004,EH-US-CHG-0005,EH-US-CHG-0006,EH-US-CHG-0007,EH-US-CHG-0008,EH-US-CHG-0009,EH-US-CHG-0010,EH-US-CHG-0081"
    UI_ENABLED: "true"
    AUTONOMOUS_EVENT_CYCLE: "false"
    LOG_LEVEL: "info"
    EVENT_INTERVAL: "5s"
    READ_TIMEOUT: "10s"
    WRITE_TIMEOUT: "20s"
    SHUTDOWN_TIMEOUT: "10s"

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
