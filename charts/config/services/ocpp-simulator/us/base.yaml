fullnameOverride: "ocpp-simulator"
podAnnotations:
  electrahub.io/config-revision: "all-region-fleet-v1"
image:
  repository: amolsurjuse/ocpi-simulator
  tag: "19"

service:
  port: 8081
containerPort: 8081

config:
  data:
    PORT: "8081"
    BASE_URL: "http://ocpp-simulator:8081"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    REDIS_TIMEOUT: "500ms"
    # Enable leader mode only in environment overlays after the Redis password
    # and pod address are supplied. Single remains safe for local development.
    SIMULATOR_CLUSTER_MODE: "single"
    SIMULATOR_CLUSTER_LEASE_KEY: "ocpp-simulator:fleet:leader"
    SIMULATOR_CLUSTER_LEASE_TTL: "15s"
    SIMULATOR_CLUSTER_LEASE_RENEW_INTERVAL: "5s"
    WS_CONNECTOR_BASE_URL: "http://web-socket-connector:8091"
    DEFAULT_CSMS_URL: "ws://ocpp-service:8082/ws/ocpp"
    PAYMENT_SERVICE_URL: "http://payment-service:8083"
    SESSION_SERVICE_URL: "http://session-service:8083/api/v1"
    AUTO_SEED_CHARGERS: "true"
    AUTO_SYNC_ENVIRONMENT_CHARGERS: "true"
    ENVIRONMENT_SYNC_URL: "http://charger-management-service:8086"
    ENVIRONMENT_SYNC_CHARGERS_PATH: "/api/v1/internal/simulator/chargers/connectors"
    ENVIRONMENT_SYNC_SESSIONS_PATH: "http://session-service:8083/api/v1/sessions/internal/active-by-chargers"
    ENVIRONMENT_SYNC_INTERVAL: "60s"
    ENVIRONMENT_SYNC_SKIP_TLS_VERIFY: "false"
    AUTO_CONNECT_CHARGERS: "true"
    # Reconcile in bounded batches so reconnecting a fleet cannot stampede OCPP.
    AUTO_CONNECT_INTERVAL: "3s"
    AUTO_CONNECT_MAX_ATTEMPTS_PER_RUN: "32"
    AUTO_CONNECT_FLEET_LIMIT: "1500"
    AUTO_CONNECT_ERROR_BACKOFF: "5s"
    ENVIRONMENT_SYNC_FLEET_LIMIT: "1500"
    AUTO_CHARGER_IDS: >-
      EH-BOS-CHG-001,EH-SFO-CHG-001,EH-US-CHG-0001,EH-US-CHG-0002,EH-US-CHG-0003,EH-US-CHG-0004,EH-US-CHG-0005,EH-US-CHG-0006,
      EH-US-CHG-0007,EH-US-CHG-0008,EH-US-CHG-0009,EH-US-CHG-0010,EH-US-CHG-0081,
      EH-IN-CHG-0001,EH-IN-CHG-0002,EH-IN-CHG-0003,EH-IN-CHG-0004,EH-IN-CHG-0005,
      EH-IN-CHG-0006,EH-IN-CHG-0007,EH-IN-CHG-0008,EH-IN-CHG-0009,EH-IN-CHG-0010,
      EH-IN-CHG-0011,EH-IN-CHG-0012,EH-IN-CHG-0013,EH-IN-CHG-0014,EH-IN-CHG-0015,
      EH-IN-CHG-0016,EH-IN-CHG-0017,EH-IN-CHG-0018,EH-IN-CHG-0019,EH-IN-CHG-0020,
      EH-SG-CHG-0001,EH-SG-CHG-0002,EH-SG-CHG-0003,EH-SG-CHG-0004,EH-SG-CHG-0005
    UI_ENABLED: "true"
    AUTONOMOUS_EVENT_CYCLE: "false"
    LOG_LEVEL: "info"
    EVENT_INTERVAL: "5s"
    READ_TIMEOUT: "10s"
    WRITE_TIMEOUT: "20s"
    SHUTDOWN_TIMEOUT: "10s"

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
