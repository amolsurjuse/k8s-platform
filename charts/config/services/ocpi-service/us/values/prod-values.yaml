secrets:
  existingSecretName: "postgresql-prod-secret"

env:
  SPRING_PROFILES_ACTIVE: "prod"

replicaCount: 1

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_LIQUIBASE_ENABLED: "true"
    OCPI_PUBLIC_BASE_URL: "https://api.electrahub.net/ocpi"

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
