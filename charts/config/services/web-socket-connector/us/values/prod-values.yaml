replicaCount: 0

extraSecretEnv:
  - name: "OCPP_HANDSHAKE_DERIVATION_KEY"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

# Connection ownership is held in this pod's in-memory socket registry.
deploymentStrategy:
  type: Recreate

env:
  # Spread a 1,028-charger cold reconnect over about five minutes so OCPP
  # authentication and its dependencies remain inside their resource budget.
  CONNECTION_START_INTERVAL: "300ms"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
