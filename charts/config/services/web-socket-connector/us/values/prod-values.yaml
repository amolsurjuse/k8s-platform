replicaCount: 1

extraSecretEnv:
  - name: "OCPP_HANDSHAKE_DERIVATION_KEY"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

# Connection ownership is held in this pod's in-memory socket registry.
deploymentStrategy:
  type: Recreate

env:
  # Admit at most twenty new sockets per second. This bounds cold-fleet and
  # capacity-test authentication pressure while allowing a 10k fleet to
  # recover within the production acceptance window.
  CONNECTION_START_INTERVAL: "50ms"
  # A charger loads only files matching its own ID. This directory is backed
  # by a runtime Secret and never by Git-managed certificate material.
  OCPP_MTLS_CERTIFICATE_DIR: "/var/run/electrahub/charger-certs"

extraVolumeMounts:
  - name: profile3-canary-certificate
    mountPath: /var/run/electrahub/charger-certs
    readOnly: true

extraVolumes:
  - name: profile3-canary-certificate
    secret:
      secretName: ocpp-profile3-canary-cert
      defaultMode: 0440

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
