replicaCount: 1

# Connection ownership is held in this pod's in-memory socket registry.
deploymentStrategy:
  type: Recreate

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
