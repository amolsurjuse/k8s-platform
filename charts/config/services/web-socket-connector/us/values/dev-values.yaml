replicaCount: 1

extraSecretEnv:
  - name: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
    secretName: "ocpp-simulator-handshake-secret"
    secretKey: "OCPP_HANDSHAKE_SIMULATOR_PASSWORD"
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"

# Gate 7C3-E development-only fault-control boundary. Matching is exact; no
# production charger or wildcard is permitted. Rules remain inert until the
# authenticated conformance runner creates a one-shot rule.
config:
  data:
    SMART_CHARGING_CONFORMANCE_ENABLED: "true"
    SMART_CHARGING_CONFORMANCE_CHARGERS: "SC-CANARY-16-CP1,SC-CANARY-201-CP1"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
