fullnameOverride: "web-socket-connector"
image:
  repository: amolsurjuse/web-socket-connector
  tag: "9"

service:
  port: 8091
containerPort: 8091

config:
  data:
    PORT: "8091"
    LOG_LEVEL: "info"
    SIMULATOR_API_BASE_URL: "http://ocpp-simulator:8081"
    REMOTE_START_METER_INTERVAL: "5s"
    REMOTE_START_DEFAULT_POWER_W: "44000"
    REMOTE_START_DEFAULT_METER_WH: "1200000"
    RECONNECT_MIN_BACKOFF: "1s"
    RECONNECT_MAX_BACKOFF: "30s"
    OCPP_HEARTBEAT_INTERVAL: "60s"
    SMART_CHARGING_CONFORMANCE_ENABLED: "false"
    SMART_CHARGING_CONFORMANCE_CHARGERS: ""

readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
