secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"

env:
  SPRING_PROFILES_ACTIVE: "prod"

replicaCount: 1

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_LIQUIBASE_ENABLED: "true"

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

resources:
  requests:
    cpu: "100m"
    memory: "384Mi"
  limits:
    cpu: "500m"
    memory: "768Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
