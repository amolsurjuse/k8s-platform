secrets:
  existingSecretName: "postgresql-prod-secret"

extraSecretEnv:
  - name: "APP_SECURITY_INTERNAL_TOKEN"
    secretName: "electrahub-internal-service-token"
    secretKey: "APP_SECURITY_INTERNAL_TOKEN"
  - name: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
    secretName: "access-context-prod-secret"
    secretKey: "APP_INTERNAL_ACCESS_CONTEXT_SECRET"
  - name: "SPRING_DATA_REDIS_PASSWORD"
    secretName: "redis-prod-secret"
    secretKey: "redis-password"

env:
  SPRING_PROFILES_ACTIVE: "prod"

replicaCount: 1

config:
  data:
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_LIQUIBASE_ENABLED: "true"
    BILLING_ANALYTICS_DELIVERY_ENABLED: "true"
    BILLING_ANALYTICS_DELIVERY_BATCH_SIZE: "50"
    BILLING_ANALYTICS_DELIVERY_POLL_INTERVAL_MS: "2000"
    BILLING_ANALYTICS_DELIVERY_LEASE_SECONDS: "60"
    BILLING_ANALYTICS_DELIVERY_MAX_ATTEMPTS: "8"
    BILLING_ANALYTICS_DELIVERY_RETRY_BASE_SECONDS: "5"
    BILLING_ANALYTICS_DELIVERY_RETRY_MAX_SECONDS: "900"
    BILLING_ANALYTICS_DELIVERY_RECONCILIATION_BATCH_SIZE: "500"
    BILLING_ANALYTICS_DELIVERY_RECONCILIATION_INTERVAL_MS: "300000"

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

resources:
  requests:
    cpu: "100m"
    memory: "384Mi"
  limits:
    cpu: "500m"
    memory: "768Mi"

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

metrics:
  servicemonitor:
    enabled: false
