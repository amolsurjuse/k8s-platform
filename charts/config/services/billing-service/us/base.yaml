fullnameOverride: "billing-service"
image:
  repository: amolsurjuse/billing-service

service:
  port: 8085
containerPort: 8085

env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-Xms192m -Xmx384m"

secrets:
  env:
    DB_USERNAME: "POSTGRES_USER"
    DB_PASSWORD: "POSTGRES_PASSWORD"

config:
  data:
    SERVER_PORT: "8085"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/billing_db"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ELASTICSEARCH_URIS: "http://elasticsearch:9200"
    SESSION_SERVICE_URL: "http://session-service:8083"
    STATION_SERVICE_URL: "http://station-management-service:8081"
    CHARGER_SERVICE_URL: "http://charger-management-service:8086"
    USER_SERVICE_URL: "http://user-service:8082"
    BILLING_ANALYTICS_ELASTICSEARCH_ENABLED: "true"
    BILLING_ANALYTICS_ELASTICSEARCH_INDEX: "charging-session-facts"
    BILLING_ANALYTICS_ELASTICSEARCH_BATCH_SIZE: "1000"
    BILLING_ANALYTICS_ELASTICSEARCH_MAX_RECORDS: "10000"
    BILLING_ANALYTICS_KAFKA_ENABLED: "true"
    BILLING_ANALYTICS_RECEIPT_TOPIC: "eh.charging.receipt.generated.v1"
    BILLING_DEMO_TARIFFS_ENABLED: "false"
    SPRING_LIQUIBASE_ENABLED: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
    MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /actuator/health/liveness
  periodSeconds: 10
  failureThreshold: 90

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
