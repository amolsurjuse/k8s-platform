replicaCount: 2

env:
  IDENTITY_BASE_URL: https://identity.electrahub.net
  IDENTITY_GATEWAY_BASE_URL: https://identity-gateway.electrahub.net/auth
  IDENTITY_CLIENT_ID: identity-admin-ui
  IDENTITY_AUDIENCE: electrahub-identity-admin
  IDENTITY_SCOPES: openid profile email identity.admin
  IDENTITY_DEMO_MODE: "false"

ingress:
  enabled: true
  className: nginx
  host: identity-admin.electrahub.net
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: electrahub-prod-tls

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity-admin-ui
