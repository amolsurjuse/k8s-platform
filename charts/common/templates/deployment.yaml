apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      containers:
        - name: {{ include "common.name" . }}
          {{- $imageRepo := required "image.repository is required" .Values.image.repository }}
          {{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.containerPort }}
            {{- end }}
          {{- $plainEnv := .Values.env | default dict }}
          {{- $secrets := .Values.secrets | default dict }}
          {{- $secretsEnv := $secrets.env | default dict }}
          {{- $secretName := $secrets.existingSecretName | default "" }}
          {{- $secretOptional := $secrets.optional | default false }}
          {{- $extraSecretEnv := .Values.extraSecretEnv | default list }}
          {{- $extraFieldRefEnv := .Values.extraFieldRefEnv | default list }}

          {{- if and .Values.config.enabled (gt (len .Values.config.data) 0) }}
          envFrom:
            - configMapRef:
                name: {{ include "common.fullname" . }}-config
          {{- end }}

          {{- if or (gt (len $plainEnv) 0) (gt (len $secretsEnv) 0) (gt (len $extraSecretEnv) 0) (gt (len $extraFieldRefEnv) 0) }}
          env:
            {{- /* Plain env vars */}}
            {{- range $k, $v := $plainEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}

            {{- /* Secret-backed env vars */}}
            {{- if $secretsEnv }}
            {{- if not $secretName }}
              {{- fail "secrets.existingSecretName is required when secrets.env is defined" }}
            {{- end }}
            {{- range $envName, $secretKey := $secretsEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
                  optional: {{ $secretOptional }}
            {{- end }}
            {{- end }}

            {{- /* Additional secret-backed env vars from arbitrary secrets */}}
            {{- range $entry := $extraSecretEnv }}
            {{- if not $entry.name }}
              {{- fail "extraSecretEnv[].name is required" }}
            {{- end }}
            {{- if not $entry.secretName }}
              {{- fail "extraSecretEnv[].secretName is required" }}
            {{- end }}
            {{- if not $entry.secretKey }}
              {{- fail "extraSecretEnv[].secretKey is required" }}
            {{- end }}
            - name: {{ $entry.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $entry.secretName }}
                  key: {{ $entry.secretKey }}
                  {{- if hasKey $entry "optional" }}
                  optional: {{ $entry.optional }}
                  {{- end }}
            {{- end }}

            {{- /* Pod metadata values from the Kubernetes Downward API */}}
            {{- range $entry := $extraFieldRefEnv }}
            {{- if not $entry.name }}
              {{- fail "extraFieldRefEnv[].name is required" }}
            {{- end }}
            {{- if not $entry.fieldPath }}
              {{- fail "extraFieldRefEnv[].fieldPath is required" }}
            {{- end }}
            - name: {{ $entry.name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $entry.fieldPath }}
                  {{- if $entry.apiVersion }}
                  apiVersion: {{ $entry.apiVersion }}
                  {{- end }}
            {{- end }}
          {{- end }}

          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
