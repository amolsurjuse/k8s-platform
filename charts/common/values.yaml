replicaCount: 2

# Leave empty for Kubernetes' default rolling update. Stateful WebSocket
# workloads can opt into Recreate in their environment values so two pods never
# own the same charge-point identity during a rollout.
deploymentStrategy: {}

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

grpc:
  enabled: false
  port: 9000
  containerPort: 9000

env: {}

config:
  enabled: true
  data: {}

# Prefer ExternalSecrets; this supports referencing an existing K8s Secret
secrets:
  existingSecretName: ""
  env: {}   # ENV_NAME: secretKey
extraSecretEnv: [] # [{name: ENV_NAME, secretName: secret-name, secretKey: key, optional: false}]
extraFieldRefEnv: [] # [{name: ENV_NAME, fieldPath: status.podIP, apiVersion: v1}]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

readinessProbe:
  enabled: true
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /actuator/health/liveness
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

startupProbe:
  enabled: false
  path: /actuator/health/liveness
  failureThreshold: 30
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

extraIngresses: []

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

pdb:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}

lifecycle: {}
terminationGracePeriodSeconds: null

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

metrics:
  servicemonitor:
    enabled: false
    interval: 30s
    scrapePath: /actuator/prometheus
