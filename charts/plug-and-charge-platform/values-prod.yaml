replicaCount: 2

image:
  tag: jdk25-3927b09
  digest: sha256:e56bab869fe1c0b9d966afc0a3aec43fcdec68197176f45d32e2f37f4a6c2355

features:
  enabled: true
  adminApiEnabled: true
  # Remains dark until a production HSM adapter and credentials are provisioned.
  pkiAdminEnabled: false
  contractCertificateEnabled: false
  # Migration is deployed dark; exchange endpoints remain unavailable in production.
  installationPackageEnabled: false
  # Fail closed until the approved CPS, EXI codec, and conformance evidence are available.
  iso15118CertificateInstallationEnabled: false
  iso15118ConformanceAdminEnabled: false
  iso15118OperationalReadinessAdminEnabled: false
  # V15 custody capability is present, but no verification key is mounted and no write API exists.
  cpsOnboardingAdminEnabled: false
  userEventsEnabled: true

pki:
  keyCustodyProvider: unavailable
  oemTrustBundle:
    enabled: false
  pkcs11:
    enabled: false

iso15118:
  provider: unavailable
  externalCps:
    # Exact target identity remains unset until a separately approved CPS onboarding change.
    providerProfileId: ""
    providerId: ""
    environment: ""
    minimumClientCertificateValidityHours: 168

# An operator must supply an approved suite, CPS/signing credentials, output
# custody, destination CIDRs and unique run ID in a separately reviewed change.
conformanceExecution:
  enabled: false

# Local-only fail-closed review of a CPS onboarding manifest and mTLS material.
# A separately approved change must provide the manifest, credentials and PVCs.
cpsOnboardingValidation:
  enabled: false

# Offline API-submission export; no private key or PVC is mounted while dark.
cpsOnboardingSigning:
  enabled: false

# Controlled Stage 25 evidence import remains dark; no token or network access is mounted.
cpsOnboardingImport:
  enabled: false

operationalEvidenceExecution:
  enabled: false

# The chaos runner is deployed only as dark chart capability. Fault injection
# must target a separately approved sandbox and must never run against prod.
chaosExecution:
  enabled: false

gatewayIdentitySecret:
  existingSecret: access-context-prod-secret

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 768Mi
