{{- if .Values.operationalEvidenceExecution.enabled }}
{{- $config := .Values.operationalEvidenceExecution }}
{{- $runId := required "operationalEvidenceExecution.runId is required" $config.runId }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$" $runId) }}
{{- fail "operationalEvidenceExecution.runId must be a lowercase DNS label of at most 40 characters" }}
{{- end }}
{{- $digest := required "operationalEvidenceExecution.image.digest is required" $config.image.digest }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{- fail "operationalEvidenceExecution.image.digest must be a sha256 digest" }}{{- end }}
{{- $endpoint := required "operationalEvidenceExecution.cpsEndpoint is required" $config.cpsEndpoint }}
{{- if not (regexMatch "^https://[^/?#]+(/[^?#]*)?$" $endpoint) }}
{{- fail "operationalEvidenceExecution.cpsEndpoint must be an HTTPS URL without query or fragment" }}
{{- end }}
{{- if empty $config.approvedDestinationCidrs }}
{{- fail "operationalEvidenceExecution.approvedDestinationCidrs must contain at least one reviewed CPS CIDR" }}
{{- end }}
{{- $inputClaim := required "operationalEvidenceExecution.input.existingClaim is required" $config.input.existingClaim }}
{{- $outputClaim := required "operationalEvidenceExecution.output.existingClaim is required" $config.output.existingClaim }}
{{- $credentialSecret := required "operationalEvidenceExecution.credentialSecret.existingSecret is required" $config.credentialSecret.existingSecret }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $config.input.manifestFile) }}
{{- fail "operationalEvidenceExecution.input.manifestFile must be a direct file name" }}{{- end }}
{{- if or (lt (int $config.maxInFlight) 1) (gt (int $config.maxInFlight) 10000) }}
{{- fail "operationalEvidenceExecution.maxInFlight must be between 1 and 10000" }}{{- end }}
{{- if or (lt (int $config.activeDeadlineSeconds) 300) (gt (int $config.activeDeadlineSeconds) 90000) }}
{{- fail "operationalEvidenceExecution.activeDeadlineSeconds must be between 300 and 90000" }}{{- end }}
{{- if or (lt (int $config.ttlSecondsAfterFinished) 3600) (gt (int $config.ttlSecondsAfterFinished) 604800) }}
{{- fail "operationalEvidenceExecution.ttlSecondsAfterFinished must be between 3600 and 604800" }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-operational-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operational-evidence
    app.kubernetes.io/instance: {{ .Release.Name }}
    electrahub.net/operational-run-id: {{ $runId | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $config.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $config.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-operational-evidence
        app.kubernetes.io/instance: {{ .Release.Name }}
        electrahub.net/operational-run-id: {{ $runId | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cps-operational-runner
          image: "{{ $config.image.repository }}@{{ $digest }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          args:
            - --manifest
            - {{ $config.input.manifestFile | quote }}
            - --artifact
            - {{ printf "capacity-%s.json" $runId | quote }}
            - --submission
            - {{ printf "submission-%s.json" $runId | quote }}
          env:
            - { name: CPS_ENDPOINT, value: {{ $endpoint | quote }} }
            - { name: CPS_CLIENT_KEY_STORE, value: /credentials/client-key-store.p12 }
            - name: CPS_CLIENT_KEY_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $credentialSecret }}, key: {{ $config.credentialSecret.clientKeyStorePasswordKey }} } }
            - { name: CPS_TRUST_STORE, value: /credentials/trust-store.p12 }
            - name: CPS_TRUST_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $credentialSecret }}, key: {{ $config.credentialSecret.trustStorePasswordKey }} } }
            - { name: CPS_MAX_IN_FLIGHT, value: {{ $config.maxInFlight | quote }} }
            - { name: CPS_CONNECT_TIMEOUT_MS, value: {{ $config.connectTimeoutMs | quote }} }
            - { name: CPS_REQUEST_TIMEOUT_MS, value: {{ $config.requestTimeoutMs | quote }} }
            - { name: CPS_MINIMUM_CLIENT_CERTIFICATE_VALIDITY_HOURS, value: {{ $config.minimumClientCertificateValidityHours | quote }} }
            - { name: OPERATIONAL_INPUT_DIR, value: /input }
            - { name: OPERATIONAL_OUTPUT_DIR, value: /output }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - { name: input, mountPath: /input, readOnly: true }
            - { name: output, mountPath: /output }
            - { name: credentials, mountPath: /credentials/client-key-store.p12, subPath: {{ $config.credentialSecret.clientKeyStoreKey }}, readOnly: true }
            - { name: credentials, mountPath: /credentials/trust-store.p12, subPath: {{ $config.credentialSecret.trustStoreKey }}, readOnly: true }
            - { name: temporary-files, mountPath: /tmp }
      volumes:
        - { name: input, persistentVolumeClaim: { claimName: {{ $inputClaim }} } }
        - { name: output, persistentVolumeClaim: { claimName: {{ $outputClaim }} } }
        - { name: credentials, secret: { secretName: {{ $credentialSecret }}, defaultMode: 0400 } }
        - { name: temporary-files, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-operational-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-operational-evidence
      app.kubernetes.io/instance: {{ .Release.Name }}
      electrahub.net/operational-run-id: {{ $runId | quote }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
      {{- range $config.approvedDestinationCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
      {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
