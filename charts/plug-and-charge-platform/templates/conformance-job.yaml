{{- if .Values.conformanceExecution.enabled }}
{{- $runId := required "conformanceExecution.runId is required" .Values.conformanceExecution.runId }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$" $runId) }}
{{- fail "conformanceExecution.runId must be a lowercase DNS label of at most 40 characters" }}
{{- end }}
{{- $imageDigest := required "conformanceExecution.image.digest is required" .Values.conformanceExecution.image.digest }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $imageDigest) }}
{{- fail "conformanceExecution.image.digest must be a sha256 digest" }}
{{- end }}
{{- $endpoint := required "conformanceExecution.cpsEndpoint is required" .Values.conformanceExecution.cpsEndpoint }}
{{- if not (regexMatch "^https://[^/?#]+(/[^?#]*)?$" $endpoint) }}
{{- fail "conformanceExecution.cpsEndpoint must be an HTTPS URL without query or fragment" }}
{{- end }}
{{- if empty .Values.conformanceExecution.approvedDestinationCidrs }}
{{- fail "conformanceExecution.approvedDestinationCidrs must contain at least one reviewed CPS CIDR" }}
{{- end }}
{{- $suiteClaim := required "conformanceExecution.suite.existingClaim is required" .Values.conformanceExecution.suite.existingClaim }}
{{- $outputClaim := required "conformanceExecution.output.existingClaim is required" .Values.conformanceExecution.output.existingClaim }}
{{- $credentialSecret := required "conformanceExecution.credentialSecret.existingSecret is required" .Values.conformanceExecution.credentialSecret.existingSecret }}
{{- $signingSecret := required "conformanceExecution.signingSecret.existingSecret is required" .Values.conformanceExecution.signingSecret.existingSecret }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" .Values.conformanceExecution.suite.manifestFile) }}
{{- fail "conformanceExecution.suite.manifestFile must be a direct file name" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" .Values.conformanceExecution.suite.vectorsDirectory) }}
{{- fail "conformanceExecution.suite.vectorsDirectory must be a direct directory name" }}
{{- end }}
{{- if or (lt (int .Values.conformanceExecution.activeDeadlineSeconds) 300) (gt (int .Values.conformanceExecution.activeDeadlineSeconds) 86400) }}
{{- fail "conformanceExecution.activeDeadlineSeconds must be between 300 and 86400" }}
{{- end }}
{{- if or (lt (int .Values.conformanceExecution.ttlSecondsAfterFinished) 3600) (gt (int .Values.conformanceExecution.ttlSecondsAfterFinished) 604800) }}
{{- fail "conformanceExecution.ttlSecondsAfterFinished must be between 3600 and 604800" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cps-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-conformance
    app.kubernetes.io/instance: {{ .Release.Name }}
    electrahub.net/conformance-run-id: {{ $runId | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.conformanceExecution.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.conformanceExecution.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-conformance
        app.kubernetes.io/instance: {{ .Release.Name }}
        electrahub.net/conformance-run-id: {{ $runId | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cps-conformance-runner
          image: "{{ .Values.conformanceExecution.image.repository }}@{{ $imageDigest }}"
          imagePullPolicy: {{ .Values.conformanceExecution.image.pullPolicy }}
          args:
            - --manifest
            - {{ printf "/suite/%s" .Values.conformanceExecution.suite.manifestFile | quote }}
            - --vectors
            - {{ printf "/suite/%s" .Values.conformanceExecution.suite.vectorsDirectory | quote }}
            - --report
            - {{ printf "/output/report-%s.json" $runId | quote }}
            - --artifact
            - {{ printf "/output/artifact-%s.json" $runId | quote }}
          env:
            - { name: CPS_ENDPOINT, value: {{ $endpoint | quote }} }
            - { name: CPS_CLIENT_KEY_STORE, value: /credentials/client-key-store.p12 }
            - name: CPS_CLIENT_KEY_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $credentialSecret }}, key: {{ .Values.conformanceExecution.credentialSecret.clientKeyStorePasswordKey }} } }
            - { name: CPS_TRUST_STORE, value: /credentials/trust-store.p12 }
            - name: CPS_TRUST_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $credentialSecret }}, key: {{ .Values.conformanceExecution.credentialSecret.trustStorePasswordKey }} } }
            - { name: CPS_MINIMUM_CLIENT_CERTIFICATE_VALIDITY_HOURS, value: {{ .Values.conformanceExecution.minimumClientCertificateValidityHours | quote }} }
            - { name: CONFORMANCE_SIGNING_KEY_FILE, value: /signing/ed25519-private-key.pem }
            - { name: CONFORMANCE_OUTPUT_DIR, value: /output }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.conformanceExecution.resources | nindent 12 }}
          volumeMounts:
            - { name: suite, mountPath: /suite, readOnly: true }
            - { name: output, mountPath: /output }
            - { name: credentials, mountPath: /credentials/client-key-store.p12, subPath: {{ .Values.conformanceExecution.credentialSecret.clientKeyStoreKey }}, readOnly: true }
            - { name: credentials, mountPath: /credentials/trust-store.p12, subPath: {{ .Values.conformanceExecution.credentialSecret.trustStoreKey }}, readOnly: true }
            - { name: signing, mountPath: /signing/ed25519-private-key.pem, subPath: {{ .Values.conformanceExecution.signingSecret.privateKeyKey }}, readOnly: true }
            - { name: temporary-files, mountPath: /tmp }
      volumes:
        - { name: suite, persistentVolumeClaim: { claimName: {{ $suiteClaim }} } }
        - { name: output, persistentVolumeClaim: { claimName: {{ $outputClaim }} } }
        - { name: credentials, secret: { secretName: {{ $credentialSecret }}, defaultMode: 0400 } }
        - { name: signing, secret: { secretName: {{ $signingSecret }}, defaultMode: 0400 } }
        - { name: temporary-files, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-cps-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-conformance
      app.kubernetes.io/instance: {{ .Release.Name }}
      electrahub.net/conformance-run-id: {{ $runId | quote }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
      {{- range .Values.conformanceExecution.approvedDestinationCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
      {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
