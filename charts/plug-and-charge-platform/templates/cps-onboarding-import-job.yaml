{{- if .Values.cpsOnboardingImport.enabled }}
{{- $config := .Values.cpsOnboardingImport }}
{{- $runId := required "cpsOnboardingImport.runId is required" $config.runId }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$" $runId) }}
{{- fail "cpsOnboardingImport.runId must be a lowercase DNS label of at most 40 characters" }}
{{- end }}
{{- $idempotencyKey := required "cpsOnboardingImport.idempotencyKey is required" $config.idempotencyKey }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" $idempotencyKey) }}
{{- fail "cpsOnboardingImport.idempotencyKey is invalid" }}
{{- end }}
{{- $endpoint := required "cpsOnboardingImport.endpoint is required" $config.endpoint }}
{{- if not (regexMatch "^https://[A-Za-z0-9.-]+(:443)?/api/v1/admin/pki/cps-onboarding-evidence$" $endpoint) }}
{{- fail "cpsOnboardingImport.endpoint must be the HTTPS onboarding evidence API" }}
{{- end }}
{{- if lt (len $config.approvedDestinationCidrs) 1 }}{{- fail "cpsOnboardingImport.approvedDestinationCidrs is required" }}{{- end }}
{{- range $config.approvedDestinationCidrs }}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])$" .) }}{{- fail "cpsOnboardingImport.approvedDestinationCidrs must contain IPv4 CIDRs" }}{{- end }}
{{- end }}
{{- $digest := required "cpsOnboardingImport.image.digest is required" $config.image.digest }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{- fail "cpsOnboardingImport.image.digest must be a sha256 digest" }}{{- end }}
{{- $inputClaim := required "cpsOnboardingImport.input.existingClaim is required" $config.input.existingClaim }}
{{- $outputClaim := required "cpsOnboardingImport.output.existingClaim is required" $config.output.existingClaim }}
{{- $credentialSecret := required "cpsOnboardingImport.credentialSecret.existingSecret is required" $config.credentialSecret.existingSecret }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $config.input.submissionFile) }}{{- fail "cpsOnboardingImport.input.submissionFile must be a direct file name" }}{{- end }}
{{- if or (lt (int $config.connectTimeoutMs) 100) (gt (int $config.connectTimeoutMs) 30000) }}{{- fail "cpsOnboardingImport.connectTimeoutMs must be between 100 and 30000" }}{{- end }}
{{- if or (lt (int $config.requestTimeoutMs) 100) (gt (int $config.requestTimeoutMs) 60000) }}{{- fail "cpsOnboardingImport.requestTimeoutMs must be between 100 and 60000" }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cps-import-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
  labels: &labels
    app.kubernetes.io/name: {{ .Chart.Name }}-cps-onboarding-importer
    app.kubernetes.io/instance: {{ .Release.Name }}
    electrahub.net/onboarding-import-run-id: {{ $runId | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $config.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $config.ttlSecondsAfterFinished }}
  template:
    metadata: { labels: *labels }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cps-onboarding-importer
          image: "{{ $config.image.repository }}@{{ $digest }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          args: ["--submission", {{ $config.input.submissionFile | quote }}, "--receipt", {{ printf "receipt-%s.json" $runId | quote }}]
          env:
            - { name: ONBOARDING_IMPORT_INPUT_DIR, value: /input }
            - { name: ONBOARDING_IMPORT_OUTPUT_DIR, value: /output }
            - { name: ONBOARDING_IMPORT_TOKEN_FILE, value: /credentials/bearer-token }
            - { name: ONBOARDING_IMPORT_ENDPOINT, value: {{ $endpoint | quote }} }
            - { name: ONBOARDING_IMPORT_IDEMPOTENCY_KEY, value: {{ $idempotencyKey | quote }} }
            - { name: ONBOARDING_IMPORT_CONNECT_TIMEOUT_MS, value: {{ $config.connectTimeoutMs | quote }} }
            - { name: ONBOARDING_IMPORT_REQUEST_TIMEOUT_MS, value: {{ $config.requestTimeoutMs | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - { name: input, mountPath: /input, readOnly: true }
            - { name: output, mountPath: /output }
            - { name: credentials, mountPath: /credentials/bearer-token, subPath: {{ $config.credentialSecret.tokenKey }}, readOnly: true }
            - { name: temporary-files, mountPath: /tmp }
      volumes:
        - { name: input, persistentVolumeClaim: { claimName: {{ $inputClaim }} } }
        - { name: output, persistentVolumeClaim: { claimName: {{ $outputClaim }} } }
        - { name: credentials, secret: { secretName: {{ $credentialSecret }}, defaultMode: 0400 } }
        - { name: temporary-files, emptyDir: { sizeLimit: 32Mi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-cps-import-%s" .Release.Name $runId | trunc 63 | trimSuffix "-" }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-cps-onboarding-importer
      app.kubernetes.io/instance: {{ .Release.Name }}
      electrahub.net/onboarding-import-run-id: {{ $runId | quote }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
      {{- range $config.approvedDestinationCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
{{- end }}
