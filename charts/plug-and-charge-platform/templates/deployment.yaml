apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
      {{- if .Values.pki.pkcs11.enabled }}
      annotations:
        checksum/pkcs11-config: {{ printf "%s|%s|slotListIndex=0" .Values.pki.pkcs11.library .Values.pki.pkcs11.tokenLabel | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.pki.pkcs11.enabled }}
      initContainers:
        - name: initialize-pkcs11-token
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p /var/lib/softhsm/tokens;
              if softhsm2-util --show-slots | grep -q 'Label: *{{ .Values.pki.pkcs11.tokenLabel }}'; then
                exit 0;
              fi;
              softhsm2-util --init-token --free --label '{{ .Values.pki.pkcs11.tokenLabel }}' --so-pin "$PKCS11_SO_PIN" --pin "$PKCS11_PIN"
          env:
            - name: SOFTHSM2_CONF
              value: {{ .Values.pki.pkcs11.configFile | quote }}
            - name: PKCS11_PIN
              valueFrom:
                secretKeyRef: { name: {{ .Values.pki.pkcs11.existingSecret }}, key: {{ .Values.pki.pkcs11.pinKey }} }
            - name: PKCS11_SO_PIN
              valueFrom:
                secretKeyRef: { name: {{ .Values.pki.pkcs11.existingSecret }}, key: {{ .Values.pki.pkcs11.soPinKey }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: pkcs11-config, mountPath: /etc/softhsm2, readOnly: true }
            - { name: pkcs11-token, mountPath: /var/lib/softhsm }
      {{- end }}
      containers:
        - name: pnc-service
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            {{- if .Values.pki.pkcs11.enabled }}
            - { name: pkcs11-config, mountPath: /etc/softhsm2, readOnly: true }
            - { name: pkcs11-token, mountPath: /var/lib/softhsm }
            {{- end }}
            {{- if .Values.pki.oemTrustBundle.enabled }}
            - { name: oem-trust-bundle, mountPath: {{ .Values.pki.oemTrustBundle.mountPath | quote }}, subPath: {{ .Values.pki.oemTrustBundle.key | quote }}, readOnly: true }
            {{- end }}
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: PNC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: PNC_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: PNC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: SPRING_RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            {{- if .Values.gatewayIdentitySecret.existingSecret }}
            - name: APP_INTERNAL_ACCESS_CONTEXT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gatewayIdentitySecret.existingSecret }}
                  key: {{ .Values.gatewayIdentitySecret.key }}
            {{- end }}
            - name: PNC_ENABLED
              value: {{ .Values.features.enabled | quote }}
            - name: PNC_ADMIN_API_ENABLED
              value: {{ .Values.features.adminApiEnabled | quote }}
            - name: PNC_PKI_ADMIN_ENABLED
              value: {{ .Values.features.pkiAdminEnabled | quote }}
            - name: PNC_CONTRACT_CERTIFICATE_ENABLED
              value: {{ .Values.features.contractCertificateEnabled | quote }}
            - name: PNC_INSTALLATION_PACKAGE_ENABLED
              value: {{ .Values.features.installationPackageEnabled | quote }}
            - name: PNC_ISO15118_CERTIFICATE_INSTALLATION_ENABLED
              value: {{ .Values.features.iso15118CertificateInstallationEnabled | quote }}
            - name: PNC_ISO15118_CONFORMANCE_ADMIN_ENABLED
              value: {{ .Values.features.iso15118ConformanceAdminEnabled | quote }}
            - name: PNC_ISO15118_PROVIDER
              value: {{ .Values.iso15118.provider | quote }}
            - name: PNC_ISO15118_RESPONSE_RETENTION_MINUTES
              value: {{ .Values.iso15118.responseRetentionMinutes | quote }}
            - name: PNC_ISO15118_CLEANUP_INTERVAL_MS
              value: {{ .Values.iso15118.cleanupIntervalMs | quote }}
            - name: PNC_ISO15118_CONFORMANCE_ENABLED
              value: {{ .Values.iso15118.conformance.enabled | quote }}
            {{- if .Values.iso15118.conformance.enabled }}
            - name: PNC_ISO15118_CONFORMANCE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "iso15118.conformance.publicKeySecret.existingSecret is required" .Values.iso15118.conformance.publicKeySecret.existingSecret }}
                  key: {{ .Values.iso15118.conformance.publicKeySecret.key }}
            {{- end }}
            - name: PNC_PKI_KEY_CUSTODY_PROVIDER
              value: {{ .Values.pki.keyCustodyProvider | quote }}
            - name: PNC_PKI_CERTIFICATE_POLICY_OID
              value: {{ .Values.pki.certificatePolicyOid | quote }}
            {{- if .Values.pki.oemTrustBundle.enabled }}
            - name: PNC_PKI_OEM_TRUST_BUNDLE_FILE
              value: {{ .Values.pki.oemTrustBundle.mountPath | quote }}
            {{- end }}
            {{- if .Values.pki.pkcs11.enabled }}
            - name: SOFTHSM2_CONF
              value: {{ .Values.pki.pkcs11.configFile | quote }}
            - name: PNC_PKI_PKCS11_CONFIG_FILE
              value: /etc/softhsm2/sunpkcs11.cfg
            - name: PNC_PKI_PKCS11_PIN
              valueFrom:
                secretKeyRef: { name: {{ .Values.pki.pkcs11.existingSecret }}, key: {{ .Values.pki.pkcs11.pinKey }} }
            {{- end }}
            - name: PNC_USER_EVENTS_ENABLED
              value: {{ .Values.features.userEventsEnabled | quote }}
            - name: PNC_OCPP_ENABLED
              value: {{ .Values.features.ocppEnabled | quote }}
            - name: PNC_OCPI_ENABLED
              value: {{ .Values.features.ocpiEnabled | quote }}
            - name: PNC_OUTBOX_PUBLISHER_ENABLED
              value: {{ .Values.features.outboxPublisherEnabled | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.pki.pkcs11.enabled }}
        - name: pkcs11-config
          configMap:
            name: {{ .Release.Name }}-pkcs11
        - name: pkcs11-token
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pkcs11
        {{- end }}
        {{- if .Values.pki.oemTrustBundle.enabled }}
        - name: oem-trust-bundle
          configMap:
            name: {{ required "pki.oemTrustBundle.existingConfigMap is required" .Values.pki.oemTrustBundle.existingConfigMap }}
            items:
              - key: {{ .Values.pki.oemTrustBundle.key }}
                path: {{ .Values.pki.oemTrustBundle.key }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
