apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pnc-service
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: PNC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: PNC_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: PNC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: SPRING_RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            {{- if .Values.gatewayIdentitySecret.existingSecret }}
            - name: APP_INTERNAL_ACCESS_CONTEXT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gatewayIdentitySecret.existingSecret }}
                  key: {{ .Values.gatewayIdentitySecret.key }}
            {{- end }}
            - name: PNC_ENABLED
              value: {{ .Values.features.enabled | quote }}
            - name: PNC_ADMIN_API_ENABLED
              value: {{ .Values.features.adminApiEnabled | quote }}
            - name: PNC_USER_EVENTS_ENABLED
              value: {{ .Values.features.userEventsEnabled | quote }}
            - name: PNC_OCPP_ENABLED
              value: {{ .Values.features.ocppEnabled | quote }}
            - name: PNC_OCPI_ENABLED
              value: {{ .Values.features.ocpiEnabled | quote }}
            - name: PNC_OUTBOX_PUBLISHER_ENABLED
              value: {{ .Values.features.outboxPublisherEnabled | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
