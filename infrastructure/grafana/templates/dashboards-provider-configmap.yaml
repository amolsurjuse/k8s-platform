apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.name" . }}-dashboard-provider
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ElectraHub
        orgId: 1
        folder: ElectraHub
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/electrahub