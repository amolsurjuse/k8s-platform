apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.name" . }}-dashboards
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  electrahub-services.json: |
    {
      "uid": "electrahub-services",
      "title": "ElectraHub Service Health",
      "tags": ["electrahub", "services", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
            "query": "label_values(up{environment=~\"prod|dev\"}, service)",
            "includeAll": true,
            "multi": true,
            "refresh": 1,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Registered Targets Up",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "sum(up{service=~\"$service\"})", "refId": "A" }],
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Server Requests Rate",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "sum by (service) (rate(http_server_requests_seconds_count{service=~\"$service\"}[5m]))", "legendFormat": "{{`{{service}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM Memory Used",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "sum by (service, area) (jvm_memory_used_bytes{service=~\"$service\"})", "legendFormat": "{{`{{service}}`}} {{`{{area}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Process CPU Usage",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "process_cpu_usage{service=~\"$service\"}", "legendFormat": "{{`{{service}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Target Status",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "up{service=~\"$service\"}", "format": "table", "instant": true, "refId": "A" }],
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "JVM Live Threads",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "max by (service) (jvm_threads_live_threads{service=~\"$service\"})", "legendFormat": "{{`{{service}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 25 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "JVM GC Pause Time Per Second",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "sum by (service) (rate(jvm_gc_pause_seconds_sum{service=~\"$service\"}[5m]))", "legendFormat": "{{`{{service}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 25 }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "OCPP Commands Awaiting Response",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "max(electrahub_ocpp_remote_command_pending{service=\"ocpp-service\"})", "legendFormat": "pending", "refId": "A" }],
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 25 }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "OCPP Command P95 Duration",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, action, outcome) (rate(electrahub_ocpp_remote_command_duration_seconds_bucket{service=\"ocpp-service\"}[5m])))", "legendFormat": "p95", "refId": "A" }],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "OCPP Lifecycle Callback Backlog",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "max(ocpp_session_callbacks_pending_lifecycle{service=\"ocpp-service\"})", "legendFormat": "pending lifecycle callbacks", "refId": "A" }],
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 41 }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "OCPP Lifecycle Retries and Dead Letters",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [
            { "expr": "sum by (type) (increase(ocpp_session_callbacks_retries_total{service=\"ocpp-service\"}[5m]))", "legendFormat": "retries {{`{{type}}`}}", "refId": "A" },
            { "expr": "sum by (type) (increase(ocpp_session_callbacks_dead_letters_total{service=\"ocpp-service\"}[5m]))", "legendFormat": "dead letters {{`{{type}}`}}", "refId": "B" }
          ],
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 41 }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Session Service Hikari Pool Pressure",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [
            { "expr": "max by (pod) (hikaricp_connections_active{service=\"session-service\"})", "legendFormat": "active {{`{{pod}}`}}", "refId": "A" },
            { "expr": "max by (pod) (hikaricp_connections_pending{service=\"session-service\"})", "legendFormat": "pending {{`{{pod}}`}}", "refId": "B" },
            { "expr": "max by (pod) (hikaricp_connections_max{service=\"session-service\"})", "legendFormat": "max {{`{{pod}}`}}", "refId": "C" }
          ],
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 41 }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Burst JVM Heap by Pod",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "sum by (service, pod) (jvm_memory_used_bytes{service=~\"ocpp-service|session-service\",area=\"heap\"})", "legendFormat": "{{`{{service}}`}} {{`{{pod}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 49 }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Burst JVM Live Threads by Pod",
          "datasource": { "type": "prometheus", "uid": "electrahub-prometheus" },
          "targets": [{ "expr": "max by (service, pod) (jvm_threads_live_threads{service=~\"ocpp-service|session-service\"})", "legendFormat": "{{`{{service}}`}} {{`{{pod}}`}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 49 }
        }
      ]
    }
