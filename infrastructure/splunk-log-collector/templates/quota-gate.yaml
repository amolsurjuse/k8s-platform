{{- if .Values.splunk.quotaGate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splunk-log-collector.name" . }}-quota-gate
  labels:
    {{- include "splunk-log-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "splunk-log-collector.name" . }}-quota-gate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/quota-gate-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "splunk-log-collector.name" . }}-quota-gate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: quota-gate
          image: "{{ .Values.quotaGate.image.repository }}:{{ .Values.quotaGate.image.tag }}"
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.splunk.quotaGate.redis.existingSecretName }}
                  key: {{ .Values.splunk.quotaGate.redis.passwordKey }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.quotaGate.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: {{ include "splunk-log-collector.name" . }}-quota-gate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "splunk-log-collector.name" . }}-quota-gate
  labels:
    {{- include "splunk-log-collector.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "splunk-log-collector.name" . }}-quota-gate
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8088
      targetPort: http
{{- end }}
