fullnameOverride: splunk-log-collector

targetNamespace: dev
clusterName: electrahub-k3d
environment: dev

image:
  repository: timberio/vector
  tag: "0.45.0-debian"
  pullPolicy: IfNotPresent

splunk:
  endpoint: https://splunk:8088
  index: main
  sourceType: kubernetes
  existingSecretName: splunk-hec-secret
  tokenKey: SPLUNK_HEC_TOKEN
  quotaGate:
    enabled: false
    maxDailyBytes: 419430400
    redis:
      host: redis
      port: 6379
      dnsResolver: 10.43.0.10
      existingSecretName: redis-prod-secret
      passwordKey: redis-password

quotaGate:
  image:
    repository: openresty/openresty
    tag: "1.25.3.1-alpine"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

elasticsearch:
  # Opt-in so non-production environments continue to send logs only to Splunk.
  enabled: false
  endpoint: http://elasticsearch:9200
  index: electrahub-kubernetes-%Y.%m.%d

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
