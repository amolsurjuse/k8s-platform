apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: platform   # or "default" if you didn't create the project
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.10.1
    helm:
      values: |
        controller:
          config:
            # Cloudflare Tunnel terminates public TLS before forwarding to
            # ingress-nginx; preserve its trusted forwarded scheme.
            use-forwarded-headers: "true"
          service:
            type: NodePort
          publishService:
            enabled: true

          ingressClassResource:
            name: nginx
            enabled: true
            default: false

        admissionWebhooks:
          enabled: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
