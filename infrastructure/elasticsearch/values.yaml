replicaCount: 1

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: "8.13.4"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 9200
  transportPort: 9300
  annotations: {}

esConfig:
  clusterName: electrahub-es
  javaOpts: "-Xms512m -Xmx512m"
  singleNode: true
  xpackSecurityEnabled: false

sysctl:
  enabled: true
  vmMaxMapCount: 262144

persistence:
  enabled: true
  storageClass: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
