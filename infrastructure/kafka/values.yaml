replicaCount: 1

image:
  repository: bitnamilegacy/kafka
  tag: "4.0.0-debian-12-r10"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 9092
  controllerPort: 9093

kafka:
  clusterId: "smfL9D2PSy2Y1AZaZirmGg"
  numPartitions: 3
  autoCreateTopics: true
  logRetentionHours: 168
  messageMaxBytes: "1048576"

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podAnnotations: {}
podLabels: {}

pdb:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
