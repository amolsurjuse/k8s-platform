{{- if and .Values.persistence.enabled (gt (int .Values.replicaCount) 0) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vllm.name" . }}-models
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
