fullnameOverride: prometheus

image:
  repository: prom/prometheus
  tag: v2.54.1
  pullPolicy: IfNotPresent

retention: 15d
scrapeInterval: 15s
evaluationInterval: 15s

persistence:
  enabled: true
  size: 10Gi

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

scrapeTargets: []