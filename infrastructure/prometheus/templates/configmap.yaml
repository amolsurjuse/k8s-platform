apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.name" . }}-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      evaluation_interval: {{ .Values.evaluationInterval }}
      external_labels:
        cluster: electrahub-k3d

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['127.0.0.1:9090']
            labels:
              service: prometheus
              namespace: {{ .Release.Namespace }}

{{- range .Values.scrapeTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        static_configs:
          - targets:
{{- range .targets }}
              - {{ . | quote }}
{{- end }}
            labels:
              service: {{ .name | quote }}
              namespace: {{ default $.Release.Namespace .namespace | quote }}
              environment: {{ default "prod" .environment | quote }}
{{- end }}
{{- range .Values.podEndpointTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ required "podEndpointTargets[].serviceName is required" .serviceName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: {{ default "http" .portName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_ready]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: service
            replacement: {{ .serviceName | quote }}
          - target_label: namespace
            replacement: {{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}
          - target_label: environment
            replacement: {{ default "prod" .environment | quote }}
{{- end }}
