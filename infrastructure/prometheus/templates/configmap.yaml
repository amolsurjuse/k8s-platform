apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.name" . }}-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      evaluation_interval: {{ .Values.evaluationInterval }}
      external_labels:
        cluster: electrahub-k3d

    rule_files:
      - /etc/prometheus/pnc-alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['127.0.0.1:9090']
            labels:
              service: prometheus
              namespace: {{ .Release.Namespace }}

{{- range .Values.scrapeTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        static_configs:
          - targets:
{{- range .targets }}
              - {{ . | quote }}
{{- end }}
            labels:
              service: {{ .name | quote }}
              namespace: {{ default $.Release.Namespace .namespace | quote }}
              environment: {{ default "prod" .environment | quote }}
{{- end }}
{{- range .Values.podEndpointTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ required "podEndpointTargets[].serviceName is required" .serviceName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: {{ default "http" .portName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_ready]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: service
            replacement: {{ .serviceName | quote }}
          - target_label: namespace
            replacement: {{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}
          - target_label: environment
            replacement: {{ default "prod" .environment | quote }}
{{- end }}
  pnc-alerts.yml: |
    groups:
      - name: plug-and-charge
        rules:
          - alert: PlugAndChargeTargetDown
            expr: sum(up{service="plug-and-charge-platform"}) < 1
            for: 5m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge metrics target is unavailable
          - alert: PlugAndChargeCpsFailureRatioHigh
            expr: >-
              sum(rate(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform",outcome="failed"}[10m]))
              /
              clamp_min(sum(rate(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform"}[10m])), 0.001)
              > 0.05
              and sum(increase(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform"}[10m])) > 10
            for: 10m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: CPS request failure ratio exceeds 5 percent
          - alert: PlugAndChargeAuthorizationBlocked
            expr: sum(increase(pnc_iso15118_authorization_total{service="plug-and-charge-platform",outcome="blocked"}[15m])) > 0
            for: 5m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge activation gate blocked a request
          - alert: PlugAndChargeContractCertificateExpired
            expr: max(pnc_certificate_inventory{service="plug-and-charge-platform",state="expired"}) > 0
            for: 5m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: One or more Plug & Charge contract certificates are expired
          - alert: PlugAndChargeContractCertificateExpiring
            expr: max(pnc_certificate_inventory{service="plug-and-charge-platform",state="expiring_30d"}) > 0
            for: 30m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: A Plug & Charge contract certificate expires within 30 days
          - alert: PlugAndChargeInventoryRefreshFailed
            expr: sum(increase(pnc_inventory_refresh_total{service="plug-and-charge-platform",outcome="failed"}[15m])) > 0
            for: 5m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge certificate inventory refresh failed
