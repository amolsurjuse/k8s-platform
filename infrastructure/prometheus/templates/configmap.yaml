apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.name" . }}-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      evaluation_interval: {{ .Values.evaluationInterval }}
      external_labels:
        cluster: electrahub-k3d

    rule_files:
      - /etc/prometheus/platform-alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['127.0.0.1:9090']
            labels:
              service: prometheus
              namespace: {{ .Release.Namespace }}

{{- range .Values.scrapeTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        static_configs:
          - targets:
{{- range .targets }}
              - {{ . | quote }}
{{- end }}
            labels:
              service: {{ .name | quote }}
              namespace: {{ default $.Release.Namespace .namespace | quote }}
              environment: {{ default "prod" .environment | quote }}
{{- end }}
{{- range .Values.podEndpointTargets }}
      - job_name: {{ .name | quote }}
        metrics_path: {{ default "/actuator/prometheus" .metricsPath | quote }}
        scheme: {{ default "http" .scheme | quote }}
        scrape_interval: {{ default $.Values.scrapeInterval .scrapeInterval }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ required "podEndpointTargets[].serviceName is required" .serviceName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: {{ default "http" .portName | quote }}
          - source_labels: [__meta_kubernetes_endpoint_ready]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: service
            replacement: {{ .serviceName | quote }}
          - target_label: namespace
            replacement: {{ .namespace | default $.Values.targetNamespace | default $.Release.Namespace | quote }}
          - target_label: environment
            replacement: {{ default "prod" .environment | quote }}
{{- end }}
  platform-alerts.yml: |
    groups:
      - name: plug-and-charge
        rules:
          - alert: PlugAndChargeTargetDown
            expr: sum(up{service="plug-and-charge-platform"}) < 1
            for: 5m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge metrics target is unavailable
          - alert: PlugAndChargeCpsFailureRatioHigh
            expr: >-
              sum(rate(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform",outcome="failed"}[10m]))
              /
              clamp_min(sum(rate(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform"}[10m])), 0.001)
              > 0.05
              and sum(increase(pnc_iso15118_cps_requests_total{service="plug-and-charge-platform"}[10m])) > 10
            for: 10m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: CPS request failure ratio exceeds 5 percent
          - alert: PlugAndChargeAuthorizationBlocked
            expr: sum(increase(pnc_iso15118_authorization_total{service="plug-and-charge-platform",outcome="blocked"}[15m])) > 0
            for: 5m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge activation gate blocked a request
          - alert: PlugAndChargeContractCertificateExpired
            expr: max(pnc_certificate_inventory{service="plug-and-charge-platform",state="expired"}) > 0
            for: 5m
            labels: { severity: critical, domain: plug-and-charge }
            annotations:
              summary: One or more Plug & Charge contract certificates are expired
          - alert: PlugAndChargeContractCertificateExpiring
            expr: max(pnc_certificate_inventory{service="plug-and-charge-platform",state="expiring_30d"}) > 0
            for: 30m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: A Plug & Charge contract certificate expires within 30 days
          - alert: PlugAndChargeInventoryRefreshFailed
            expr: sum(increase(pnc_inventory_refresh_total{service="plug-and-charge-platform",outcome="failed"}[15m])) > 0
            for: 5m
            labels: { severity: warning, domain: plug-and-charge }
            annotations:
              summary: Plug & Charge certificate inventory refresh failed
      - name: billing-analytics
        rules:
          - alert: BillingAnalyticsTargetDown
            expr: sum(up{service="billing-service",environment="prod"}) < 1
            for: 5m
            labels: { severity: critical, domain: billing-analytics }
            annotations:
              summary: Billing analytics metrics target is unavailable
              description: Prometheus has been unable to scrape the production billing service for five minutes.
          - alert: BillingAnalyticsProjectionLagHigh
            expr: max(electrahub_analytics_projection_oldest_unpublished_seconds{service="billing-service",environment="prod"}) > 120
            for: 5m
            labels: { severity: warning, domain: billing-analytics }
            annotations:
              summary: Billing analytics projection is more than two minutes behind
              description: The oldest unpublished charging-session fact has exceeded the dashboard freshness SLO for five minutes.
          - alert: BillingAnalyticsProjectionLagCritical
            expr: max(electrahub_analytics_projection_oldest_unpublished_seconds{service="billing-service",environment="prod"}) > 900
            for: 2m
            labels: { severity: critical, domain: billing-analytics }
            annotations:
              summary: Billing analytics projection is more than fifteen minutes behind
              description: Dashboard data is critically stale and the delivery worker or Elasticsearch requires intervention.
          - alert: BillingAnalyticsDeadLetterPresent
            expr: max(electrahub_analytics_projection_dead_backlog{service="billing-service",environment="prod"}) > 0
            for: 2m
            labels: { severity: critical, domain: billing-analytics }
            annotations:
              summary: Billing analytics has a dead-lettered projection
              description: At least one charging-session fact exhausted its delivery attempts and requires replay or reconciliation.
          - alert: BillingAnalyticsRetryBacklogPersistent
            expr: max(electrahub_analytics_projection_retry_backlog{service="billing-service",environment="prod"}) > 0
            for: 15m
            labels: { severity: warning, domain: billing-analytics }
            annotations:
              summary: Billing analytics retry backlog is persistent
              description: One or more projections have remained in retry for fifteen minutes.
          - alert: BillingAnalyticsDeliveryStalled
            expr: >-
              max(electrahub_analytics_projection_pending{service="billing-service",environment="prod"}) > 0
              and
              sum(increase(electrahub_analytics_projection_published_total{service="billing-service",environment="prod"}[10m])) == 0
            for: 10m
            labels: { severity: critical, domain: billing-analytics }
            annotations:
              summary: Billing analytics delivery is stalled
              description: Unpublished projections exist, but none has been published during the last ten minutes.
          - alert: BillingAnalyticsHttp5xxRatioHigh
            expr: >-
              sum(rate(http_server_requests_seconds_count{service="billing-service",environment="prod",status=~"5.."}[10m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{service="billing-service",environment="prod"}[10m])), 0.001)
              > 0.05
              and
              sum(increase(http_server_requests_seconds_count{service="billing-service",environment="prod"}[10m])) > 20
            for: 10m
            labels: { severity: warning, domain: billing-analytics }
            annotations:
              summary: Billing service HTTP 5xx ratio exceeds five percent
              description: Production billing requests have sustained an elevated server-error ratio with meaningful traffic.
