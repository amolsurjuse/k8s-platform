apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charger-management-service-prod
  namespace: argocd
spec:
  project: electrahub-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: charts/common
    helm:
      releaseName: charger-management-service
      valueFiles:
        - charger-management-service/values.yaml
        - ../config/services/charger-management-service/us/base.yaml
        - ../config/services/charger-management-service/us/values/prod-values.yaml
        - ../config/services/charger-management-service/us/version/prod-version.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
