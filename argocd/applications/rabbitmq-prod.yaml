apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-prod
  namespace: argocd
spec:
  project: electrahub-prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: infrastructure/rabbitmq
    helm:
      releaseName: rabbitmq
      valueFiles:
        - ../../platform-config/infrastructure/rabbitmq/us/values/prod.yaml

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
