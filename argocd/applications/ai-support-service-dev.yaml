apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-support-service
  namespace: argocd
spec:
  project: electrahub-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: charts/common
    helm:
      releaseName: ai-support-service
      valueFiles:
        - ai-support-service/values.yaml
        - ../config/services/ai-support-service/us/base.yaml
        - ../config/services/ai-support-service/us/values/dev-values.yaml
        - ../config/services/ai-support-service/us/version/dev-version.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
