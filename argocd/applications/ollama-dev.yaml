apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-dev
  namespace: argocd
spec:
  project: electrahub-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: infrastructure/ollama
    helm:
      releaseName: ollama
      valueFiles:
        - values.yaml
        - ../../platform-config/infrastructure/ollama/us/values/dev.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
