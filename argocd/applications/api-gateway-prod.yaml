apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-prod
  namespace: argocd
spec:
  project: electrahub-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: charts/common
    helm:
      releaseName: api-gateway
      valueFiles:
        - api-gateway/values.yaml
        - ../config/services/api-gateway/us/base.yaml
        - ../config/services/api-gateway/us/values/prod-values.yaml
        - ../config/services/api-gateway/us/version/prod-version.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
