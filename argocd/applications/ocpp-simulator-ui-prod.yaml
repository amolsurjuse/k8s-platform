apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocpp-simulator-ui-prod
  namespace: argocd
spec:
  project: electrahub-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: charts/common
    helm:
      releaseName: ocpp-simulator-ui
      valueFiles:
        - ocpp-simulator-ui/values.yaml
        - ../config/services/ocpp-simulator-ui/us/base.yaml
        - ../config/services/ocpp-simulator-ui/us/values/prod-values.yaml
        - ../config/services/ocpp-simulator-ui/us/version/prod-version.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
