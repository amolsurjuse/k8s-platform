apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-admin-ui
  namespace: argocd
spec:
  project: electrahub-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: agent/identity-admin-ui-gitops
    path: charts/common
    helm:
      releaseName: identity-admin-ui
      valueFiles:
        - identity-admin-ui/values.yaml
        - ../config/services/identity-admin-ui/us/base.yaml
        - ../config/services/identity-admin-ui/us/values/dev-values.yaml
        - ../config/services/identity-admin-ui/us/version/dev-version.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
