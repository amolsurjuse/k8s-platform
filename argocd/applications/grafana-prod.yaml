apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-prod
  namespace: argocd
spec:
  project: electrahub-prod

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: infrastructure/grafana
    helm:
      releaseName: grafana
      valueFiles:
        - ../../platform-config/infrastructure/grafana/us/values/prod.yaml

  syncPolicy:
    syncOptions:
      - CreateNamespace=true