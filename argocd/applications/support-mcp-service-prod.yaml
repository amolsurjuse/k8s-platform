apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: support-mcp-service-prod
  namespace: argocd
spec:
  project: electrahub-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/amolsurjuse/k8s-platform.git
    targetRevision: develop
    path: charts/support-mcp-service
    helm:
      releaseName: support-mcp-service
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
