apiVersion: v1
kind: Service
metadata:
  name: teamcity-external
  namespace: cloudflare
spec:
  ports:
    - name: http
      port: 8111
      protocol: TCP
      targetPort: 8111
---
apiVersion: v1
kind: Endpoints
metadata:
  name: teamcity-external
  namespace: cloudflare
subsets:
  - addresses:
      - ip: 172.17.0.1
    ports:
      - name: http
        port: 8111
        protocol: TCP
